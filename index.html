<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub de Animes — Clpher</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d18;--panel:#131827;--line:#262d44;--text:#eef1f8;--muted:#98a2bd;--sun:#ff8a5c;--gold:#f2c46d;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
button,input,select{font:inherit;color:var(--text)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.hero{position:relative;min-height:min(62vh,520px);display:flex;align-items:flex-end;background:#1a1f33 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,#0a0d1800 60%),linear-gradient(90deg,#0a0d18d9,#0a0d1800 70%)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,48px);flex-wrap:wrap}
.brand{font:600 1.25rem var(--serif)}
.brand i{color:var(--sun)}
.who{display:flex;gap:8px}
.who input,.who button{background:#0a0d18aa;backdrop-filter:blur(8px);border:1px solid #ffffff2a;border-radius:999px;padding:7px 14px}
.who button:hover{border-color:var(--sun)}
.hero-in{position:relative;padding:0 clamp(16px,4vw,48px) 36px;max-width:760px}
.hero-in small{color:var(--gold);font-weight:500}
.hero-in h1{font:800 clamp(2.2rem,6vw,4.4rem)/1.02 var(--serif);margin:6px 0 10px;text-shadow:0 2px 30px #000a}
.hero-in p{margin:0 0 16px;color:#d5daea}
.go{background:var(--sun);color:#1a0d08;border:0;border-radius:999px;padding:10px 22px;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 80px}
.tabs{display:flex;gap:4px;margin:8px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--sun)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.bar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
h2{font:600 1.5rem var(--serif);margin:34px 0 14px}
.sub{color:var(--muted);margin:0 0 6px}
.poster{position:relative;display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:2/3;background:var(--panel);text-align:left;box-shadow:0 10px 30px #0008;transition:transform .2s}
.poster:hover{transform:translateY(-5px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .cap{position:absolute;inset:auto 0 0 0;padding:34px 10px 10px;background:linear-gradient(0deg,#05070ff0,#05070f00);font-size:.88rem;line-height:1.25}
.poster .cap b{display:block}
.poster .cap span{color:#c3cbe0;font-size:.78rem}
.pb{height:3px;background:#ffffff30;margin-top:6px;border-radius:2px}.pb i{display:block;height:100%;background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.wides{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.wide{display:flex;gap:14px;align-items:flex-end;min-height:150px;padding:14px;border:0;border-radius:14px;text-align:left;background:#1a1f33 center/cover;position:relative;overflow:hidden;box-shadow:0 10px 30px #0008}
.wide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0d18f2 30%,#0a0d1866)}
.wide>*{position:relative}
.wide img{width:78px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 6px 20px #000a}
.wide b{font:600 1.15rem/1.2 var(--serif);display:block}
.wide .pb{width:160px}
.meta{color:var(--muted);font-size:.85rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,28px);align-items:end;margin-bottom:26px}
.pod{position:relative;padding-top:18px}
.pod:nth-child(1){order:2}.pod:nth-child(2){order:1}.pod:nth-child(3){order:3}
.pod:nth-child(1) .poster{transform:scale(1.06)}
.num{position:absolute;top:-6px;left:-4px;z-index:2;font:800 clamp(3rem,9vw,5.5rem)/1 var(--serif);color:var(--gold);text-shadow:0 4px 24px #000}
.pod .info{margin-top:10px;text-align:center}
.pod .info b{display:block;line-height:1.25}
.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.row{display:grid;grid-template-columns:34px 46px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 10px}
.row:hover{border-color:var(--sun)}
.row img{width:46px;height:66px;object-fit:cover;border-radius:6px}
.pos{font:600 1.3rem var(--serif);color:var(--muted);text-align:center}
.tier{display:inline-block;font-weight:600;border-left:4px solid var(--c);padding:2px 10px;border-radius:4px;background:#0a0d1899;white-space:nowrap}
.tier small{color:var(--muted);font-weight:400;margin-left:6px}
.msg{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.err{color:var(--sun)}
details summary{cursor:pointer;color:var(--muted);margin:18px 0}
dialog{width:min(740px,94vw);max-height:90vh;overflow:auto;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0}
dialog::backdrop{background:#000b}
.dh{min-height:170px;padding:18px 22px;display:flex;flex-direction:column;justify-content:flex-end;background:#1a1f33 center/cover;position:relative}
.dh::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),#0a0d1840)}
.dh>*{position:relative}.dh h2{margin:0 0 4px}
.dx{position:absolute!important;top:12px;right:14px;background:#0a0d18aa;border:1px solid #ffffff2a;border-radius:999px;padding:5px 14px}
.db{padding:6px 22px 22px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
video{width:100%;border-radius:8px;margin-top:8px;background:#000}
code{font-size:.8rem;color:var(--muted)}
a{color:var(--sun)}
.cp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.yr{margin:32px 0}
.yr h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.yb{background:none;border:0;padding:0;font:800 2.4rem/1 var(--serif);color:var(--gold)}
.yb:hover{color:var(--sun)}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:190px;padding:14px;border:0;border-radius:14px;text-align:left;overflow:hidden;background:#1a1f33 center/cover;box-shadow:0 8px 24px #0007;transition:transform .2s}
button.cell:hover{transform:translateY(-4px)}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0a0d18f5 25%,#0a0d1866)}
.cell>*{position:relative}
.cell b{font:600 1.05rem/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sn{position:relative!important;display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:auto;padding-bottom:12px}
.sn em{font-style:normal;color:var(--muted);font-weight:400;font-size:.8rem}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:#c3cbe0}.mini span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mini i{flex-shrink:0}
.mini i{font-style:normal;color:var(--gold)}
.cell.empty{background:none;border:1px dashed var(--line);box-shadow:none;justify-content:center;align-items:center}
.cell.empty::before{display:none}
@media(max-width:760px){.seasons{grid-template-columns:repeat(2,1fr)}}
input.sc{width:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.hidden{display:none}
@media(max-width:560px){.pod .info small{display:none}}


/* ============ REPAGINAÇÃO VISUAL — TESTE 01 ============ */
:root{
  --bg:#090c16;
  --panel:#111827;
  --line:rgba(164,178,211,.14);
  --text:#f2f3f8;
  --muted:#9aa6c1;
  --sun:#ff916b;
  --gold:#f1c879;
  --surface:rgba(18,25,41,.78);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{
  background:
    radial-gradient(ellipse at 82% 12%,rgba(85,65,125,.13),transparent 34rem),
    radial-gradient(ellipse at 8% 55%,rgba(38,75,111,.10),transparent 30rem),
    var(--bg);
  letter-spacing:.005em;
}
button{ -webkit-tap-highlight-color:transparent }
.hero{
  min-height:clamp(430px,59vh,620px);
  background-color:#11182a;
  background-position:center 35%;
  isolation:isolate;
}
.hero::before{
  background:
    linear-gradient(0deg,var(--bg) 0%,rgba(9,12,22,.82) 7%,rgba(9,12,22,.05) 60%),
    linear-gradient(90deg,rgba(7,10,19,.88) 0%,rgba(7,10,19,.58) 34%,rgba(7,10,19,.06) 78%),
    linear-gradient(180deg,rgba(7,10,19,.34),transparent 28%);
}
.top{
  padding:20px clamp(20px,4.2vw,64px);
  z-index:2;
}
.brand{font-size:1.38rem;letter-spacing:-.035em;text-shadow:0 2px 18px #0008}
.who{align-items:center;gap:9px}
.profile-chip{
  display:inline-flex;align-items:center;gap:7px;min-height:42px;
  padding:7px 16px;border:1px solid rgba(241,200,121,.28);
  border-radius:999px;background:rgba(10,13,24,.62);
  color:#c5cee2;font-size:.88rem;backdrop-filter:blur(16px);
}
.profile-chip strong{color:var(--gold);font-weight:600}
.who input,.who button{
  min-height:42px;
  background:rgba(10,13,24,.62);
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(16px);
  box-shadow:0 8px 28px rgba(0,0,0,.12);
  transition:border-color .2s,background .2s,transform .2s;
}
.who input{width:190px;padding-inline:16px}
.who button:hover{border-color:rgba(255,145,107,.72);background:rgba(20,25,40,.88);transform:translateY(-1px)}
.hero-in{max-width:900px;padding:0 clamp(20px,4.2vw,64px) 54px}
.hero-in small{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 11px;border:1px solid rgba(241,200,121,.28);
  border-radius:999px;background:rgba(8,11,20,.42);backdrop-filter:blur(10px);
  color:var(--gold);font-size:.82rem;letter-spacing:.025em;
}
.hero-in h1{
  max-width:850px;
  font-size:clamp(2.8rem,6.2vw,5.6rem);
  letter-spacing:-.045em;
  line-height:.98;
  margin:15px 0 13px;
  text-wrap:balance;
}
.hero-in p{font-size:.98rem;color:#d7dced;margin-bottom:20px}
.go{
  padding:12px 22px;border-radius:999px;
  box-shadow:0 8px 28px rgba(255,145,107,.2);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.go:hover{transform:translateY(-2px);background:#ffa17f;box-shadow:0 12px 32px rgba(255,145,107,.27)}
.wrap{max-width:1320px;padding:0 clamp(20px,4.2vw,64px) 100px}
#sub{
  display:inline-flex;align-items:center;min-height:34px;
  margin:4px 0 8px;padding:5px 11px;
  border:1px solid var(--line);border-radius:999px;
  background:rgba(17,24,39,.55);font-size:.82rem;
}
#me{margin:0 0 22px;font-size:.78rem;overflow-wrap:anywhere}
#me code{color:#c0c9df}
.tabs{
  position:sticky;top:0;z-index:5;
  gap:6px;margin:8px 0 25px;padding:8px;
  border:1px solid rgba(164,178,211,.12);border-radius:15px;
  background:rgba(9,12,22,.82);backdrop-filter:blur(18px);
  box-shadow:0 12px 32px rgba(0,0,0,.14);
  scrollbar-width:thin;
}
.tabs button{
  position:relative;border:0;border-radius:10px;
  padding:10px 17px;color:#aab4cb;
  transition:color .2s,background .2s;
}
.tabs button:hover{color:var(--text);background:rgba(255,255,255,.045)}
.tabs button[aria-selected=true]{color:#fff;background:rgba(255,145,107,.11)}
.tabs button[aria-selected=true]::after{
  content:"";position:absolute;left:17px;right:17px;bottom:3px;height:2px;
  border-radius:2px;background:var(--sun);
}
h2{font-size:1.72rem;letter-spacing:-.025em;margin:38px 0 17px}
.sub{color:#b3bfd8}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.poster{
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.24);
  transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
}
.poster:hover{
  transform:translateY(-6px) scale(1.012);
  border-color:rgba(255,145,107,.48);
  box-shadow:0 18px 42px rgba(0,0,0,.34);
}
.poster .cap{padding:48px 12px 12px;background:linear-gradient(0deg,rgba(4,6,13,.98),rgba(4,6,13,.68) 48%,transparent)}
.poster .cap b{font-size:.93rem;letter-spacing:-.01em}
.poster .cap span{font-size:.79rem}
.wides{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:17px}
.wide{
  min-height:166px;padding:16px;border:1px solid rgba(255,255,255,.07);
  border-radius:16px;background-position:center;background-size:cover;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.wide:hover{transform:translateY(-3px);border-color:rgba(255,145,107,.42);box-shadow:0 17px 36px rgba(0,0,0,.3)}
.wide::before{background:linear-gradient(90deg,rgba(7,10,19,.96) 22%,rgba(7,10,19,.75) 58%,rgba(7,10,19,.28))}
.wide img{width:86px;border:1px solid rgba(255,255,255,.13);border-radius:9px}
.wide b{font-size:1.22rem;letter-spacing:-.02em}
.pb{height:4px;background:rgba(255,255,255,.18)}
.pb i{border-radius:4px}
.meta{color:#a6b2cd}
.bar{gap:9px;margin:0 0 24px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(17,24,39,.56)}
.bar select,.cp,input.sc{
  min-height:38px;background:#151d30;border:1px solid rgba(164,178,211,.18);border-radius:9px;
  transition:border-color .2s,background .2s;
}
.bar select{padding:8px 13px}
.bar select:focus,.cp:hover,input.sc:focus{border-color:rgba(255,145,107,.65)}
.podium{gap:clamp(12px,3vw,34px);max-width:900px;margin:8px auto 34px}
.pod .info b{font-size:.98rem}
.num{color:var(--gold);font-size:clamp(3.2rem,8vw,5.8rem)}
.row{background:linear-gradient(110deg,rgba(20,28,46,.96),rgba(16,22,37,.96));border-color:rgba(164,178,211,.13);padding:10px 15px 10px 11px;transition:transform .18s,border-color .18s,background .18s}
.row:hover{transform:translateX(3px);border-color:rgba(255,145,107,.5);background:#192238}
.msg{background:rgba(17,24,39,.48);border-color:rgba(164,178,211,.22);border-radius:15px}
.tier{background:rgba(8,11,20,.7);border-radius:6px}
.yr{margin:42px 0}
.yr h2{gap:16px;margin-bottom:16px}
.yb{font-size:2.8rem;letter-spacing:-.04em}
.seasons{gap:14px}
.cell{min-height:220px;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;transition:transform .22s,border-color .22s,box-shadow .22s}
button.cell:hover{transform:translateY(-5px);border-color:rgba(255,145,107,.48);box-shadow:0 16px 34px rgba(0,0,0,.28)}
.cell::before{background:linear-gradient(0deg,rgba(7,10,19,.98) 13%,rgba(7,10,19,.72) 48%,rgba(7,10,19,.13))}
.cell b{font-size:1.16rem}
.cell.empty{background:rgba(17,24,39,.26)}
.dialog,dialog{box-shadow:0 28px 90px rgba(0,0,0,.5)}
dialog{border-color:rgba(164,178,211,.22);box-shadow:0 28px 90px rgba(0,0,0,.55)}
.dh{min-height:210px}
.db{padding:10px 24px 26px}
.theme{background:linear-gradient(145deg,rgba(20,29,48,.96),rgba(15,21,35,.96));border-color:rgba(164,178,211,.14);border-radius:14px;padding:15px}
.cp{padding:7px 12px;color:#e7ebf5}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
@media(max-width:760px){
  .hero{min-height:470px;background-position:58% center}
  .hero-in{padding-bottom:38px}
  .hero-in h1{font-size:clamp(2.6rem,10vw,4.2rem)}
  .wrap{padding-inline:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}
  .seasons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{margin-inline:-2px}
  .tabs button{padding-inline:13px}
}
@media(max-width:520px){
  .top{align-items:flex-start;flex-direction:column}
  .who{width:100%;flex-wrap:wrap}
  .who input{flex:1;min-width:110px;width:auto}
  .who button{padding-inline:12px}
  .hero{min-height:510px}
  .hero-in h1{font-size:2.65rem}
  .wides{grid-template-columns:1fr}
  .wide{min-height:145px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .seasons{gap:10px}
  .cell{min-height:190px;padding:12px}
  .yr h2{align-items:flex-start;flex-direction:column;gap:8px}
  .row{grid-template-columns:28px 42px minmax(0,1fr) auto;gap:9px;padding:8px}
  .row img{width:42px;height:60px}
  .tier{padding:2px 7px;font-size:.85rem}
  .tier small{margin-left:3px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

/* ============ DIÁRIO DE EPISÓDIOS — TESTE 01 ============ */
.detail-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:5px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px}
.detail-tabs button{border:0;border-radius:9px;padding:9px 14px;background:transparent;color:var(--muted)}
.detail-tabs button[aria-selected="true"]{background:rgba(255,145,107,.13);color:var(--text)}
.diary-intro{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.diary-form{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(17,24,39,.55)}
.diary-form label{display:block;color:var(--muted);font-size:.8rem;margin:0 0 5px}
.diary-form input,.diary-form textarea{width:100%;background:#0c1220;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:inherit}
.diary-form textarea{min-height:92px;resize:vertical;grid-column:1/-1}
.diary-form .wide-field{grid-column:1/-1}
.diary-form button{justify-self:start;background:var(--sun);color:#1a0d08;border:0;border-radius:999px;padding:9px 17px;font-weight:600}
.diary-list{display:grid;gap:10px}
.diary-entry{padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(17,24,39,.55)}
.diary-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.diary-entry-head strong{font-family:var(--serif);font-size:1.05rem}
.diary-entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.diary-actions{display:flex;gap:7px;margin-top:12px}
.diary-actions button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:.82rem}
.diary-actions button:hover{border-color:var(--sun);color:var(--text)}
.diary-status{min-height:1.4em;color:var(--muted);font-size:.82rem}
.experience-form{display:grid;gap:14px;padding:16px;border:1px solid var(--line);border-radius:13px;background:rgba(17,24,39,.55)}
.experience-form label{display:block;color:var(--muted);font-size:.82rem;margin:0 0 6px}
.experience-form select,.experience-form input,.experience-form textarea,.theme-comment{width:100%;background:#0c1220;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:inherit}
.platform-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:8px}
.platform-option{position:relative;display:flex!important;align-items:center;gap:9px;min-height:46px;margin:0!important;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025);color:var(--text)!important;font-size:.9rem!important;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.platform-option:hover{border-color:var(--sun);background:rgba(242,196,109,.07)}
.platform-option:has(input:checked){border-color:var(--sun);background:rgba(242,196,109,.13);box-shadow:inset 0 0 0 1px rgba(242,196,109,.22)}
.platform-option input{width:17px!important;height:17px;flex:0 0 17px;margin:0;accent-color:var(--sun);cursor:pointer}
.platform-option span{line-height:1.2}
.platform-hint{color:var(--muted);font-size:.78rem;margin:7px 0 0}
@media(max-width:420px){.platform-picker{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.platform-option{padding:9px;min-height:43px}}
.experience-form textarea,.theme-comment{min-height:84px;resize:vertical}
.experience-form button,.theme-comment-save{justify-self:start;background:var(--sun);color:#1a0d08;border:0;border-radius:999px;padding:9px 17px;font-weight:600}
.form-hint{color:var(--muted);font-size:.8rem;margin:4px 0 0}
.theme-comment-wrap{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.theme-comment-wrap label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}
.theme-comment-save{margin-top:7px}.experience-status{color:var(--muted);font-size:.82rem;min-height:1.2em}
@media(max-width:560px){.diary-form{grid-template-columns:1fr}.diary-form textarea,.diary-form .wide-field{grid-column:auto}.diary-entry-head{align-items:flex-start;flex-direction:column}}
/* ============ SINCRONIZAÇÃO E BACKUP ============ */
.sync-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.sync-status{color:var(--muted);font-size:.82rem;min-height:1.3em}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap}
.sync-actions button{background:rgba(17,24,39,.8);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--text)}
.sync-actions button:hover{border-color:var(--sun)}
.sync-actions button:disabled{opacity:.55;cursor:wait}
/* ============ FIM DO DIÁRIO ============ */

/* ============ FIM DA REPAGINAÇÃO VISUAL ============ */

</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="top">
    <div class="brand">Hub de <i>animes</i></div>
    <div class="who"><span class="profile-chip" aria-label="Perfil AniList fixo">AniList: <strong>Clpher</strong></span><button id="load" type="button">Sincronizar AniList</button><button id="login" type="button">Entrar com Google</button></div>
  </div>
  <div class="hero-in" id="heroin"><h1>Carregando…</h1></div>
</header>
<div class="wrap">
  <p class="sub" id="sub"></p>
  <div class="sync-tools">
    <span class="sync-status" id="sync-status" role="status">Catálogo público via AniList; cache local por até 24 horas.</span>
    <div class="sync-actions"><button id="export-data" type="button" class="hidden">Exportar meus dados (JSON)</button><button id="import-data" type="button" class="hidden">Importar backup (JSON)</button><input id="import-file" type="file" accept=".json,application/json" class="hidden" aria-label="Selecionar backup JSON"></div>
  </div>
  <p class="meta" id="me"></p>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="now">Agora</button>
    <button role="tab" aria-selected="false" data-tab="panel">Painel</button>
    <button role="tab" aria-selected="false" data-tab="top">Top animes</button>
    <button role="tab" aria-selected="false" data-tab="hall">Hall da fama OP e ED</button>
  </div>
  <div class="bar hidden" id="filters">
    <select id="type" aria-label="Tipo"><option value="OP">Openings</option><option value="ED">Endings</option></select>
    <select id="year" aria-label="Ano"></select>
    <select id="season" aria-label="Temporada"><option value="">Todas as temporadas</option><option value="WINTER">Winter</option><option value="SPRING">Spring</option><option value="SUMMER">Summer</option><option value="FALL">Fall</option></select>
    <select id="limit" aria-label="Quantidade"><option value="10">Top 10</option><option value="25">Top 25</option><option value="9999">Tudo</option></select>
  </div>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>

<script>
/* ============ CONFIGURAÇÃO ============ */
const OWNER_ANILIST_USERNAME = "Clpher";
const OWNER_UID = "X569uLFYFgcX6i9mbEVsylUX7Li1";
window.HUB_OWNER_UID = OWNER_UID;
/* Notas das músicas (0-100). Chave: "IDdoAnimeNoAniList:OP1" (ou ED1, OP2...).
   Use o botão "Copiar linha" na janela do anime e cole aqui. */
const SONG_SCORES = {
  // "ID:OP1": 95,
};
/* ======================================= */

const QUERY = `query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{entries{
 status progress score(format:POINT_100)
 media{id siteUrl season seasonYear episodes status bannerImage coverImage{extraLarge large} title{romaji english}}}}}}`;
const TIERS=[[100,"Masterpiece","#f2c46d"],[95,"Almost Perfect","#ff7a4d"],[90,"Excellent","#f5a63c"],[85,"Very Good","#7ac36a"],
 [80,"Good","#4aa8e0"],[75,"Decent","#98a2bd"],[70,"Average","#a89fb5"],[60,"Bad","#d98a3a"],[0,"Very Bad","#c0453f"]];
const tier=s=>TIERS.find(t=>s>=t[0]);
const badge=s=>{const t=tier(s);return `<span class="tier" style="--c:${t[2]}">${s}<small>${t[1]}</small></span>`};
const sbadge=s=>{const t=tier(s*10);return `<span class="tier" style="--c:${t[2]}">${s}<small>/10</small></span>`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const SEASONS={WINTER:"Winter",SPRING:"Spring",SUMMER:"Summer",FALL:"Fall"};
const when=a=>[SEASONS[a.season],a.year].filter(Boolean).join(" ");
const bg=u=>u?`style="background-image:url('${u}')"`:"";

let animes=[],tab="now",fbUser=null,fbErr=null,loadingCatalog=false;
const byId=id=>animes.find(a=>a.id===id);
const themeCache=new Map();

async function fetchList(user){
  const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QUERY,variables:{u:user}})});
  const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
  const seen=new Map();
  j.data.MediaListCollection.lists.forEach(l=>l.entries.forEach(e=>{if(!seen.has(e.media.id))seen.set(e.media.id,e)}));
  return [...seen.values()].map(e=>({id:e.media.id,title:e.media.title.english||e.media.title.romaji,
    cover:e.media.coverImage.extraLarge||e.media.coverImage.large,banner:e.media.bannerImage,url:e.media.siteUrl,
    season:e.media.season,year:e.media.seasonYear,eps:e.media.episodes,airing:e.media.status,
    status:e.status,progress:e.progress,score:e.score}));
}
async function fetchThemes(id){
  if(themeCache.has(id)) return themeCache.get(id);
  const r=await fetch(`https://api.animethemes.moe/anime?filter[has]=resources&filter[site]=AniList&filter[external_id]=${id}&include=animethemes.animethemeentries.videos,animethemes.song.artists`);
  const j=await r.json();
  const th=(j.anime?.[0]?.animethemes||[]).map(t=>({slug:t.slug,type:t.type,title:t.song?.title||"(sem título)",
    artist:(t.song?.artists||[]).map(a=>a.name).join(", "),eps:t.animethemeentries?.[0]?.episodes||"",
    video:(t.animethemeentries?.[0]?.videos||[]).sort((a,b)=>(b.resolution||0)-(a.resolution||0))[0]?.link}));
  themeCache.set(id,th); return th;
}

function renderHero(){
  const pool=animes.filter(a=>a.banner&&["CURRENT","REPEATING"].includes(a.status));
  const best=animes.filter(a=>a.banner&&a.score>=95);
  const list=pool.length?pool:best.length?best:animes.filter(a=>a.banner);
  const a=list[Math.floor(Math.random()*list.length)];
  if(!a){$("heroin").innerHTML="<h1>Meu hub de animes</h1>";return}
  $("hero").style.backgroundImage=`url('${a.banner}')`;
  const cur=["CURRENT","REPEATING"].includes(a.status);
  $("heroin").innerHTML=`<small>${cur?`Assistindo agora, ep ${a.progress}${a.eps?" de "+a.eps:""}`:`Um dos meus ${a.score}+`}</small>
   <h1>${esc(a.title)}</h1><p>${when(a)}</p><button class="go" data-id="${a.id}">Ver OP e ED</button>`;
}

const poster=a=>{
  const cur=["CURRENT","REPEATING"].includes(a.status),pct=a.eps?Math.min(100,a.progress/a.eps*100):0;
  return `<button class="poster" data-id="${a.id}"><img src="${a.cover}" alt="" loading="lazy"><div class="cap"><b>${esc(a.title)}</b>${cur?`<div class="pb"><i style="width:${pct}%"></i></div><span>ep ${a.progress}${a.eps?" / "+a.eps:""}</span>`:`<span>${when(a)}</span>`}</div></button>`};
const wide=a=>{const pct=a.eps?Math.min(100,a.progress/a.eps*100):0;
  return `<button class="wide" data-id="${a.id}" ${bg(a.banner)}><img src="${a.cover}" alt=""><div><b>${esc(a.title)}</b><div class="meta">${when(a)}</div><div class="pb"><i style="width:${pct}%"></i></div><span class="meta">ep ${a.progress}${a.eps?" / "+a.eps:""}</span></div></button>`};
const sec=(t,l,f,c)=>l.length?`<h2>${t} <span class="meta">${l.length}</span></h2><div class="${c}">${l.map(f).join("")}</div>`:"";

function renderNow(){
  const w=animes.filter(a=>["CURRENT","REPEATING"].includes(a.status)),p=animes.filter(a=>a.status==="PLANNING");
  const now=p.filter(a=>a.airing==="RELEASING"),soon=p.filter(a=>a.airing==="NOT_YET_RELEASED"),old=p.filter(a=>!["RELEASING","NOT_YET_RELEASED"].includes(a.airing));
  $("view").innerHTML=sec("Assistindo",w,wide,"wides")+sec("Planejo, no ar agora",now,poster,"grid")+sec("Planejo, em breve",soon,poster,"grid")+
   (old.length?`<details><summary>Planejo, já lançados (${old.length})</summary><div class="grid">${old.map(poster).join("")}</div></details>`:"");
}
const filtered=l=>{const y=$("year").value,s=$("season").value;return l.filter(i=>(!y||String(i.year)===y)&&(!s||i.season===s))};

function ranking(items){ /* items: {id,cover,title,sub,score} */
  if(!items.length) return '<div class="msg">Nada com esses filtros.</div>';
  const pod=items.slice(0,3),rest=items.slice(3);
  return `<div class="podium">${pod.map((a,k)=>`<div class="pod"><span class="num">${k+1}</span><button class="poster" data-id="${a.id}"><img src="${a.cover}" alt=""></button>
    <div class="info"><b>${esc(a.title)}</b><small class="meta">${esc(a.sub)}</small><div style="margin-top:6px">${(a.song?sbadge(a.score):badge(a.score))}</div></div></div>`).join("")}</div>
   <ol class="list">${rest.map((a,k)=>`<li><button class="row" data-id="${a.id}"><span class="pos">${k+4}</span><img src="${a.cover}" alt="" loading="lazy"><div><b>${esc(a.title)}</b><div class="meta">${esc(a.sub)}</div></div>${(a.song?sbadge(a.score):badge(a.score))}</button></li>`).join("")}</ol>`;
}
function renderPanel(){
  const rated=animes.filter(a=>a.score>0&&a.year);
  const years=[...new Set(rated.map(a=>a.year))].sort((a,b)=>b-a);
  if(!years.length){$("view").innerHTML='<div class="msg">Ainda não há animes com nota e ano.</div>';return}
  $("view").innerHTML='<p class="meta">Clique num ano ou numa temporada pra ver o top completo.</p>'+years.map(y=>{
    const ys=rated.filter(a=>a.year===y).sort((a,b)=>b.score-a.score);
    const cells=Object.keys(SEASONS).map(k=>{
      const l=ys.filter(a=>a.season===k);
      if(!l.length) return `<div class="cell empty"><span class="meta">${SEASONS[k]}</span><span class="meta">sem notas</span></div>`;
      const t=l[0];
      return `<button class="cell" data-go="${y}|${k}" ${bg(t.banner||t.cover)}><span class="sn">${SEASONS[k]}<em>${l.length} com nota</em></span><b>${esc(t.title)}</b>${badge(t.score)}${l.slice(1,3).map(a=>`<span class="mini"><span>${esc(a.title)}</span><i>${a.score}</i></span>`).join("")}</button>`}).join("");
    return `<section class="yr"><h2><button class="yb" data-go="${y}|">${y}</button><span class="meta">${ys.length} com nota · melhor do ano: ${esc(ys[0].title)} (${ys[0].score})</span></h2><div class="seasons">${cells}</div></section>`}).join("");
}
function renderTop(){
  const l=filtered(animes.filter(a=>a.score>0)).sort((a,b)=>b.score-a.score).slice(0,+$("limit").value);
  $("view").innerHTML=ranking(l.map(a=>({id:a.id,cover:a.cover,title:a.title,sub:when(a),score:a.score})));
}
async function renderHall(){
  $("view").innerHTML='<div class="msg">Carregando notas das músicas…</div>';
  try{
    const scores=await hubFB.getSongScores();
    Object.keys(SONG_SCORES).forEach(k=>delete SONG_SCORES[k]);Object.assign(SONG_SCORES,scores);
  }catch(e){
    $("view").innerHTML=`<div class="msg err">Não consegui carregar as notas das músicas (${esc(e.code||e.message)}).</div>`;return;
  }
  const keys=Object.keys(SONG_SCORES);
  if(!keys.length){$("view").innerHTML='<div class="msg">Ainda não há músicas com nota.</div>';return}
  const ids=[...new Set(keys.map(k=>+k.split(":")[0]))],items=[];
  await Promise.all(ids.map(async id=>{try{
    const th=await fetchThemes(id),a=byId(id);
    th.forEach(t=>{const sc=SONG_SCORES[`${id}:${t.slug}`];if(sc!=null)items.push({type:t.type,season:a?.season,year:a?.year,id,cover:a?.cover||"",title:t.title,sub:`${t.artist} · ${a?.title||"Anime "+id}`,score:sc,song:true})});
  }catch(e){}}));
  const l=filtered(items.filter(i=>i.type===$("type").value)).sort((a,b)=>b.score-a.score).slice(0,+$("limit").value);
  $("view").innerHTML=ranking(l);
}

function renderThemeList(id,th,note,offline=false){
  const root=$("themes"),comments=note?.themeComments||{};
  root.className="";
  if(!th?.length){
    const savedComments=Object.entries(comments);
    if(savedComments.length){
      root.innerHTML=`<p class="meta">${offline?"AnimeThemes indisponível. Exibindo seus comentários pessoais que já estavam salvos.":"Não há músicas cadastradas para exibir."}</p>`+savedComments.map(([slug,comment])=>`<article class="theme"><b>${esc(slug)}</b><p style="white-space:pre-wrap;margin:9px 0 0">${esc(comment||"")}</p></article>`).join("");
    }else root.innerHTML=`<div class="msg">${offline?"Não foi possível consultar o AnimeThemes e ainda não existe uma lista de músicas salva para este anime.":"O AnimeThemes não tem OP/ED cadastrado pra esse anime."}</div>`;
    return;
  }
  root.innerHTML=(offline?'<p class="meta">Exibindo a lista de músicas salva anteriormente. O AnimeThemes está indisponível no momento.</p>':"")+th.map(t=>{
    const key=`${id}:${t.slug}`,sc=SONG_SCORES[key],comment=comments[t.slug]||"";
    return `<div class="theme"><b>${esc(t.slug)}</b> · ${esc(t.title)} <span class="meta">${esc(t.artist)}${t.eps?" · eps "+esc(t.eps):""}</span> ${sc!=null?sbadge(sc):""}
      ${t.video?`<video controls preload="none" src="${esc(t.video)}"></video>`:""}
      ${fbUser?`<div style="margin-top:8px"><label class="meta" for="sc-${key}">Nota (opcional)</label><input class="sc" id="sc-${key}" type="text" inputmode="decimal" placeholder="0 a 10" value="${sc??""}"> <button class="cp" data-save="${key}">Salvar nota</button> <code id="st-${key}"></code></div><div class="theme-comment-wrap"><label for="tc-${key}">Minha impressão sobre esta música (opcional)</label><textarea class="theme-comment" id="tc-${key}" maxlength="5000" placeholder="O que achou da música, animação, cenas…">${esc(comment)}</textarea><button class="theme-comment-save" data-save-theme-comment="${esc(t.slug)}">Salvar comentário</button> <span class="experience-status" id="tcs-${key}"></span></div>`:(comment?`<div class="theme-comment-wrap public-theme-comment"><span class="meta">Minha impressão</span><p style="white-space:pre-wrap;margin:8px 0 0">${esc(comment)}</p></div>`:"")}</div>`
  }).join("");
}

async function openAnime(id){
  const a=byId(id),d=$("dlg");activeDiaryAnime=id;window.activeDiaryAnime=id;
  d.innerHTML=`<div class="dh" ${bg(a?.banner||a?.cover)}><button class="dx" onclick="dlg.close()">Fechar</button><h2>${esc(a?.title||"Anime "+id)}</h2>
   <div class="meta">${a?when(a):""} ${a?.score?badge(a.score):""} · <a href="${a?.url||"https://anilist.co/anime/"+id}" target="_blank" rel="noopener">AniList</a></div></div>
   <div class="db"><div class="detail-tabs"><button type="button" data-detail-tab="themes" aria-selected="true">OP e ED</button><button type="button" data-detail-tab="experience" aria-selected="false">Minha experiência</button><button type="button" data-detail-tab="diary" aria-selected="false">Diário de episódios</button></div>
   <section id="detail-themes"><div id="themes" class="msg">Carregando músicas e comentários salvos…</div></section>
   <section id="detail-experience" class="hidden"><div id="experience-content" class="msg">Carregando…</div></section>
   <section id="detail-diary" class="hidden"><div id="diary-content" class="msg">Carregando diário…</div></section></div>`;
  d.showModal();
  let note={};try{note=await hubFB.getAnimeNote(id)}catch(e){}
  try{
    const th=await fetchThemes(id),themeList=th.length?th:(note.themeCatalog||[]);
    if(themeList.length){try{Object.assign(SONG_SCORES,await hubFB.getSongScoresForAnime(id,themeList.map(t=>t.slug)))}catch(e){}}
    renderThemeList(id,themeList,note,!th.length);
  }catch(e){renderThemeList(id,note.themeCatalog||[],note,true)}
  loadDiary(id);loadExperience(id);
}

async function loadExperience(id){
  const root=$("experience-content");
  root.className="msg";root.textContent="Carregando informações…";
  try{
    const data=await hubFB.getAnimeNote(id);if(activeDiaryAnime!==id||!$("dlg").open)return;
    const platforms=Array.isArray(data.platforms)?data.platforms:[];
    const languageLabel=({sub:"Legendado",dub:"Dublado",other:"Outro"})[data.language]||"Não informado";
    if(!fbUser){
      const hasData=!!(data.language||platforms.length||data.otherPlatform||data.viewingNotes);
      root.className="";
      root.innerHTML=hasData?`<div class="experience-public"><p><span class="meta">Idioma</span><br><strong>${esc(languageLabel)}</strong></p><p><span class="meta">Plataforma(s)</span><br><strong>${esc([...platforms,...(data.otherPlatform?[data.otherPlatform]:[])].join(", ")||"Não informado")}</strong></p><p><span class="meta">Outras informações</span></p><p style="white-space:pre-wrap">${esc(data.viewingNotes||"Não informado")}</p></div>`:'<div class="msg">Ainda não há informações públicas sobre como assisti a este anime.</div>';
      return;
    }
    root.className="";
    root.innerHTML=`<p class="diary-intro">Informações opcionais sobre como você assistiu a este anime. Elas ficam salvas separadamente dos dados do AniList.</p>
      <form class="experience-form" id="experience-form">
       <div><label for="watch-language">Idioma</label><select id="watch-language"><option value="">Não informado</option><option value="sub" ${data.language==="sub"?"selected":""}>Legendado</option><option value="dub" ${data.language==="dub"?"selected":""}>Dublado</option><option value="other" ${data.language==="other"?"selected":""}>Outro</option></select></div>
       <div><label>Plataforma(s) em que assistiu</label><div class="platform-picker" id="watch-platforms">
        ${["Crunchyroll","Netflix","Prime Video","Disney+","Max","YouTube","Outra"].map(platform=>`<label class="platform-option"><input type="checkbox" name="watch-platform" value="${platform}" ${platforms.includes(platform)?"checked":""}><span>${platform}</span></label>`).join("")}
       </div><p class="platform-hint">Selecione quantas plataformas quiser. As opções marcadas ficam destacadas.</p></div>
       <div><label for="watch-platform-other">Outra plataforma (opcional)</label><input id="watch-platform-other" maxlength="100" value="${esc(data.otherPlatform||"")}" placeholder="Nome da plataforma"></div>
       <div><label for="watch-notes">Outras informações (opcional)</label><textarea id="watch-notes" maxlength="5000" placeholder="Ex.: acompanhei semanalmente, assisti com amigos…">${esc(data.viewingNotes||"")}</textarea></div>
       <button type="submit">Salvar minha experiência</button><span class="experience-status" id="experience-status" role="status"></span>
      </form>`;
    $("experience-form").addEventListener("submit",async ev=>{
      ev.preventDefault();const btn=ev.currentTarget.querySelector('button[type="submit"]'),status=$("experience-status");btn.disabled=true;status.textContent="Salvando…";
      const selectedPlatforms=[...$("watch-platforms").querySelectorAll("input[name=\"watch-platform\"]:checked")].map(o=>o.value);
      try{await hubFB.saveAnimeNote(id,{language:$("watch-language").value,platforms:selectedPlatforms,otherPlatform:$("watch-platform-other").value.trim(),viewingNotes:$("watch-notes").value.trim()});status.textContent="Salvo!";}
      catch(err){status.textContent="Não foi possível salvar: "+(err.code||err.message)}finally{btn.disabled=false}
    });
  }catch(err){root.className="";root.innerHTML=`<div class="msg err">Não consegui carregar as informações (${esc(err.code||err.message)}).</div>`}
}

let activeDiaryAnime=null;window.activeDiaryAnime=null;window.addEventListener("diary-auth-refresh",()=>{if(activeDiaryAnime!=null){loadDiary(activeDiaryAnime);loadExperience(activeDiaryAnime)}});
function localDateISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function diaryDate(value){
  if(!value)return "Esqueci a data";
  const d=new Date(value+"T12:00:00");

    // Itens removidos da lista do AniList deixam de aparecer, mas seus metadados não são apagados.
    for(const group of chunks(existing.filter(d=>!activeIds.has(d.id)),400)){
      const batch=writeBatch(db);group.forEach(d=>batch.set(d.ref,{inList:false,syncedAt:serverTimestamp()},{merge:true}));await batch.commit();
    }
    await setDoc(doc(db,"users",uid,"animeCatalog","_meta"),{anilistUser:username,lastSyncedAt:serverTimestamp(),itemCount:items.length,syncIntervalHours:24},{merge:true});
    return items.length;
  },
  saveThemeCatalog:(animeId,themes)=>{
    if(!auth.currentUser)throw new Error("Faça login para salvar a lista de músicas.");
    return setDoc(doc(db,"users",auth.currentUser.uid,"animeNotes",String(animeId)),{animeId:Number(animeId),themeCatalog:themes.map(t=>({slug:t.slug,type:t.type,title:t.title,artist:t.artist,eps:t.eps||"",video:t.video||""})),themeCatalogUpdatedAt:serverTimestamp()},{merge:true});
  },
  getAllAnimeNotes:async()=>{
    if(!auth.currentUser)throw new Error("Faça login para consultar suas anotações.");
    const snap=await getDocs(collection(db,"users",auth.currentUser.uid,"animeNotes"));const out={};snap.forEach(d=>out[d.id]=d.data());return out;
  },
  exportData:async()=>{
    if(!auth.currentUser)throw new Error("Faça login para exportar seus dados.");
    const uid=auth.currentUser.uid;
    const [catalog,notes,logs,scores]=await Promise.all([
      getDocs(collection(db,"users",uid,"animeCatalog")),
      getDocs(collection(db,"users",uid,"animeNotes")),
      getDocs(collection(db,"users",uid,"episodeLogs")),
      getDocs(collection(db,"songScores"))
    ]);
    const clean=value=>{
      if(value&&typeof value.toDate==="function")return value.toDate().toISOString();
      if(Array.isArray(value))return value.map(clean);
      if(value&&typeof value==="object") {const out={};for(const [k,v] of Object.entries(value))out[k]=clean(v);return out;}
      return value;
    };
    const docs=snap=>snap.docs.map(d=>({id:d.id,...clean(d.data())}));
    return {format:"hub-animes-backup",version:1,exportedAt:new Date().toISOString(),user:{uid,displayName:auth.currentUser.displayName||null},data:{animeCatalog:docs(catalog),animeNotes:docs(notes),episodeLogs:docs(logs),songScores:docs(scores)}};
  },
  validateBackup:backup=>{
    if(!backup||typeof backup!=="object"||backup.format!=="hub-animes-backup"||backup.version!==1)throw new Error("Formato ou versão de backup não reconhecidos.");
    if(!backup.data||typeof backup.data!=="object")throw new Error("O arquivo não contém a seção de dados.");
    const names=["animeCatalog","animeNotes","episodeLogs","songScores"],counts={};
    for(const name of names){
      const rows=backup.data[name];
      if(!Array.isArray(rows))throw new Error(`A seção ${name} está ausente ou inválida.`);
      const seen=new Set();
      for(const row of rows){
        if(!row||typeof row!=="object"||Array.isArray(row)||typeof row.id!=="string"||!row.id.trim()||row.id.includes("/"))throw new Error(`Há um registro inválido na seção ${name}.`);
        if(seen.has(row.id))throw new Error(`O backup contém IDs duplicados em ${name}.`);
        seen.add(row.id);
      }
      counts[name]=rows.length;
    }
    return {counts,total:Object.values(counts).reduce((a,b)=>a+b,0)};
  },
  importData:async backup=>{
    if(!auth.currentUser)throw new Error("Faça login para importar seus dados.");
    const validation=window.hubFB.validateBackup(backup),uid=auth.currentUser.uid;
    const dateFields=new Set(["createdAt","updatedAt","syncedAt","lastSyncedAt","themeCatalogUpdatedAt"]);
    const restoreDates=(value,key="")=>{
      if(value===null||value===undefined)return value;
      if(dateFields.has(key)&&typeof value==="string"){
        const time=Date.parse(value);if(Number.isFinite(time))return new Date(time);
      }
      if(Array.isArray(value))return value.map(v=>restoreDates(v));
      if(typeof value==="object"){const out={};for(const [k,v] of Object.entries(value))out[k]=restoreDates(v,k);return out;}
      return value;
    };
    const destinations={
      animeCatalog:row=>doc(db,"users",uid,"animeCatalog",row.id),
      animeNotes:row=>doc(db,"users",uid,"animeNotes",row.id),
      episodeLogs:row=>doc(db,"users",uid,"episodeLogs",row.id),
      songScores:row=>doc(db,"songScores",row.id)
    };
    const operations=[];
    for(const name of Object.keys(destinations))for(const row of backup.data[name]){
      const {id,...fields}=row;
      operations.push({ref:destinations[name](row),data:restoreDates(fields)});
    }
    // Firestore aceita até 500 operações por lote; usamos margem para manter o limite.
    for(let i=0;i<operations.length;i+=400){
      const batch=writeBatch(db);
      for(const op of operations.slice(i,i+400))batch.set(op.ref,op.data,{merge:true});
      await batch.commit();
    }
    await cacheDelete("songScores");
    for(const row of backup.data.animeNotes)await cacheDelete(noteCacheKey(row.id));
    for(const row of backup.data.episodeLogs)await cacheDelete(logsCacheKey(row.animeId));
    return {counts:validation.counts,total:validation.total};
  },
  getAnimeNote:async animeId=>freshOrCached(noteCacheKey(animeId),async()=>{const snap=await getDoc(notePath(animeId));return snap.exists()?snap.data():{}}),
  saveAnimeNote:async(animeId,data)=>{requireOwner();await setDoc(notePath(animeId),{animeId:Number(animeId),...data,updatedAt:serverTimestamp()},{merge:true});const old=(await cacheGet(noteCacheKey(animeId)))?.data||{};await cacheSet(noteCacheKey(animeId),{...old,...data});},
  saveThemeComment:async(animeId,slug,comment)=>{requireOwner();await setDoc(notePath(animeId),{animeId:Number(animeId),themeComments:{[slug]:comment},updatedAt:serverTimestamp()},{merge:true});const old=(await cacheGet(noteCacheKey(animeId)))?.data||{};await cacheSet(noteCacheKey(animeId),{...old,themeComments:{...(old.themeComments||{}),[slug]:comment}})},
  addLog:async({animeId,episode,watchedAt,comment})=>{requireOwner();await addDoc(logsPath(),{animeId:Number(animeId),episode:Number(episode),watchedAt,comment,createdAt:serverTimestamp()});await cacheDelete(logsCacheKey(animeId))},
  getLogs:async animeId=>freshOrCached(logsCacheKey(animeId),async()=>{const q=query(logsPath(),where("animeId","==",Number(animeId)));const snap=await getDocs(q);return snap.docs.map(d=>({id:d.id,...d.data(),createdAtMs:d.data().createdAt?.toMillis?.()||0}))}),
  updateLog:async(id,changes)=>{requireOwner();await updateDoc(doc(db,"users",OWNER_UID,"episodeLogs",id),{...changes,updatedAt:serverTimestamp()});await cacheDelete(logsCacheKey(window.activeDiaryAnime))},
  deleteLog:async id=>{requireOwner();await deleteDoc(doc(db,"users",OWNER_UID,"episodeLogs",id));await cacheDelete(logsCacheKey(window.activeDiaryAnime))}
};
onAuthStateChanged(auth,u=>{
  emit("fb-user",u&&u.uid===OWNER_UID?{uid:u.uid,name:u.displayName||u.email}:null);
  if(u&&u.uid!==OWNER_UID)signOut(auth).catch(()=>{});
  if(window.activeDiaryAnime&&document.getElementById("detail-diary")&&!document.getElementById("detail-diary").classList.contains("hidden"))window.dispatchEvent(new CustomEvent("diary-auth-refresh"));
});
</script>
