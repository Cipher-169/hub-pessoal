<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171613">
<meta name="description" content="NEXUS — seu espaço pessoal para acompanhar e organizar animes.">
<title>NEXUS / ANIMES</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="assets/nexus-animes.png">
<link rel="apple-touch-icon" href="assets/nexus-animes.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero" id="hero">
  <div class="top">
  <div class="brand">
    <span class="brand-name">NEXUS</span><span aria-hidden="true" style="color:var(--muted);margin:0 7px">/</span><span class="brand-hub">ANIMES</span><span class="project-version" id="project-version">v—</span>
    <a
      class="anilist-profile-link"
      href="https://anilist.co/user/Clpher/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir meu perfil no AniList em nova aba"
    >Meu AniList ↗</a>
  </div>

  <div class="who">
    <span class="profile-chip" aria-label="Perfil AniList fixo">
      AniList: <strong>Clpher</strong>
    </span>
    <button id="load" type="button">Sincronizar AniList</button>
    <button id="login" type="button">Entrar com Google</button>
  </div>
</div>
  <div class="hero-in" id="heroin"><h1>Carregando…</h1></div>
</header>
<div class="wrap">
  <p class="sub" id="sub"></p>
  <div class="sync-tools">
    <span class="sync-status" id="sync-status" role="status">Catálogo público via AniList; cache local por até 24 horas.</span>
    <div class="sync-actions"><button id="export-data" type="button" class="hidden">Exportar meus dados (JSON)</button><button id="import-data" type="button" class="hidden">Importar backup (JSON)</button><input id="import-file" type="file" accept=".json,application/json" class="hidden" aria-label="Selecionar backup JSON"></div>
  </div>
  <section class="anilist-connect" aria-label="Conexão da conta AniList">
    <div class="anilist-connect-info">
      <strong>Conexão com AniList</strong>
      <span class="anilist-connect-status" id="anilist-connection-status" role="status">Aguardando autenticação do Firebase…</span>
      <span class="anilist-connect-meta" id="anilist-connection-meta"></span>
    </div>
    <div class="anilist-connect-actions">
      <button type="button" class="primary" id="anilist-connect" disabled>Conectar AniList</button>
      <button type="button" id="anilist-disconnect" class="hidden" disabled>Desconectar</button>
      <button type="button" id="anilist-retry" class="hidden" disabled>Verificar novamente</button>
    </div>
    <p class="anilist-feedback" id="anilist-feedback" role="status" aria-live="polite"></p>
  </section>
  <p class="meta" id="me"></p>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="now">Agora</button>
    <button role="tab" aria-selected="false" data-tab="panel">Painel</button>
    <button role="tab" aria-selected="false" data-tab="top">Top animes</button>
    <button role="tab" aria-selected="false" data-tab="hall">Hall da fama OP e ED</button>
    <button role="tab" aria-selected="false" data-tab="stats" id="stats-tab">Estatísticas</button>
    <button role="tab" aria-selected="false" data-tab="ranking" id="ranking-tab">Ranking musical</button>
    <button role="tab" aria-selected="false" data-tab="writing-style" id="writing-style-tab">Biblioteca de estilo</button>
  </div>
  <div class="bar hidden" id="filters">
    <input id="search-query" type="search" placeholder="Filtrar por nome do anime…" aria-label="Filtrar por nome">
    <select id="type" aria-label="Tipo"><option value="OP">Openings</option><option value="ED">Endings</option></select>
    <select id="year" aria-label="Ano"></select>
    <select id="season" aria-label="Temporada"><option value="">Todas as temporadas</option><option value="WINTER">Winter</option><option value="SPRING">Spring</option><option value="SUMMER">Summer</option><option value="FALL">Fall</option></select>
    <select id="limit" aria-label="Quantidade"><option value="10">Top 10</option><option value="25">Top 25</option><option value="9999">Tudo</option></select>
  </div>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>
<dialog id="import-preview-dialog" aria-labelledby="import-preview-title"></dialog>

<script src="js/core.js"></script>
<script src="js/library.js"></script>
<script src="js/details.js"></script>
<script src="js/statistics.js"></script>
<script src="js/rankings.js"></script>
<script src="js/app.js"></script>
<script src="js/backup.js"></script>
<script src="js/writing-style.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
