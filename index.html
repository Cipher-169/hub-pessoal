<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171613">
<meta name="description" content="NEXUS — seu espaço pessoal para acompanhar e organizar animes.">
<title>NEXUS / ANIMES</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="assets/nexus-animes.png">
<link rel="apple-touch-icon" href="assets/nexus-animes.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d18;--panel:#131827;--line:#262d44;--text:#eef1f8;--muted:#98a2bd;--sun:#ff8a5c;--gold:#f2c46d;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
button,input,select{font:inherit;color:var(--text)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.hero{position:relative;min-height:min(62vh,520px);display:flex;align-items:flex-end;background:#1a1f33 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,#0a0d1800 60%),linear-gradient(90deg,#0a0d18d9,#0a0d1800 70%)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,48px);flex-wrap:wrap}
.brand{font:600 1.25rem var(--serif)}
.brand i{color:var(--sun)}
.anilist-profile-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-left:16px;
  padding:7px 12px;
  border:1px solid var(--sun);
  border-radius:8px;
  background:rgba(255, 255, 255, .07);
  color:var(--sun);
  font:600 .82rem var(--sans);
  text-decoration:none;
  transition:background .2s, transform .2s;
  vertical-align:middle;
}

.anilist-profile-link:hover{
  background:rgba(255, 255, 255, .15);
  transform:translateY(-1px);
}
.project-version{display:inline-flex;align-items:center;margin-left:9px;padding:3px 9px;border:1px solid #ffffff35;border-radius:999px;color:var(--gold);font:500 .72rem var(--sans);vertical-align:middle;letter-spacing:.03em}
.who{display:flex;gap:8px}
.who input,.who button{background:#0a0d18aa;backdrop-filter:blur(8px);border:1px solid #ffffff2a;border-radius:999px;padding:7px 14px}
.who button:hover{border-color:var(--sun)}
.hero-in{position:relative;padding:0 clamp(16px,4vw,48px) 36px;max-width:760px}
.hero-in small{color:var(--gold);font-weight:500}
.hero-in h1{font:800 clamp(2.2rem,6vw,4.4rem)/1.02 var(--serif);margin:6px 0 10px;text-shadow:0 2px 30px #000a}
.hero-in p{margin:0 0 16px;color:#d5daea}
.go{background:var(--sun);color:#1a0d08;border:0;border-radius:999px;padding:10px 22px;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 80px}
.tabs{display:flex;gap:4px;margin:8px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--sun)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.bar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
h2{font:600 1.5rem var(--serif);margin:34px 0 14px}
.sub{color:var(--muted);margin:0 0 6px}
.poster{position:relative;display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:2/3;background:var(--panel);text-align:left;box-shadow:0 10px 30px #0008;transition:transform .2s}
.poster:hover{transform:translateY(-5px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .cap{position:absolute;inset:auto 0 0 0;padding:34px 10px 10px;background:linear-gradient(0deg,#05070ff0,#05070f00);font-size:.88rem;line-height:1.25}
.poster .cap b{display:block}
.poster .cap span{color:#c3cbe0;font-size:.78rem}
.pb{height:3px;background:#ffffff30;margin-top:6px;border-radius:2px}.pb i{display:block;height:100%;background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.wides{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.wide{display:flex;gap:14px;align-items:flex-end;min-height:150px;padding:14px;border:0;border-radius:14px;text-align:left;background:#1a1f33 center/cover;position:relative;overflow:hidden;box-shadow:0 10px 30px #0008}
.wide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0d18f2 30%,#0a0d1866)}
.wide>*{position:relative}
.wide img{width:78px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 6px 20px #000a}
.wide b{font:600 1.15rem/1.2 var(--serif);display:block}
.wide .pb{width:160px}
.meta{color:var(--muted);font-size:.85rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,28px);align-items:end;margin-bottom:26px}
.pod{position:relative;padding-top:18px}
.pod:nth-child(1){order:2}.pod:nth-child(2){order:1}.pod:nth-child(3){order:3}
.pod:nth-child(1) .poster{transform:scale(1.06)}
.num{position:absolute;top:-6px;left:-4px;z-index:2;font:800 clamp(3rem,9vw,5.5rem)/1 var(--serif);color:var(--gold);text-shadow:0 4px 24px #000}
.pod .info{margin-top:10px;text-align:center}
.pod .info b{display:block;line-height:1.25}
.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.row{display:grid;grid-template-columns:34px 46px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 10px}
.row:hover{border-color:var(--sun)}
.row img{width:46px;height:66px;object-fit:cover;border-radius:6px}
.pos{font:600 1.3rem var(--serif);color:var(--muted);text-align:center}
.tier{display:inline-block;font-weight:600;border-left:4px solid var(--c);padding:2px 10px;border-radius:4px;background:#0a0d1899;white-space:nowrap}
.tier small{color:var(--muted);font-weight:400;margin-left:6px}
.msg{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.err{color:var(--sun)}
details summary{cursor:pointer;color:var(--muted);margin:18px 0}
dialog{width:min(740px,94vw);max-height:90vh;overflow:auto;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0}
dialog::backdrop{background:#000b}
.dh{min-height:170px;padding:18px 22px;display:flex;flex-direction:column;justify-content:flex-end;background:#1a1f33 center/cover;position:relative}
.dh::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),#0a0d1840)}
.dh>*{position:relative}.dh h2{margin:0 0 4px}
.dx{position:absolute!important;top:12px;right:14px;background:#0a0d18aa;border:1px solid #ffffff2a;border-radius:999px;padding:5px 14px}
.dmode{position:absolute!important;top:12px;right:86px;background:#0a0d18aa;border:1px solid #ffffff2a;border-radius:999px;padding:5px 12px;color:var(--text);font-size:1.05rem;line-height:1.4}
.dmode:hover,.dx:hover{border-color:var(--sun)}
#dlg.fullscreen{
  position:fixed;inset:0;margin:0;width:100vw;max-width:none;
  height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;
  padding:0;overflow:auto;overscroll-behavior:contain;
}
#dlg.fullscreen .dh{min-height:clamp(230px,34vh,390px);padding:28px clamp(20px,5vw,72px) 30px;background-position:center 35%}
#dlg.fullscreen .dh h2{font-size:clamp(2rem,5vw,3.8rem);max-width:1000px}
#dlg.fullscreen .db{max-width:1240px;margin:0 auto;padding:22px clamp(18px,4vw,52px) 64px}
#dlg.fullscreen .detail-tabs{position:sticky;top:0;z-index:5;padding:8px;background:rgba(9,12,22,.92);backdrop-filter:blur(16px)}
#dlg.fullscreen .theme{padding:16px;margin:16px 0}
#dlg.fullscreen .diary-entry,#dlg.fullscreen .experience-form{padding:18px}
@media(max-width:600px){
  #dlg.fullscreen .dh{min-height:250px;padding:24px 18px 22px}
  #dlg.fullscreen .db{padding:16px 14px 42px}
  #dlg.fullscreen .detail-tabs{gap:4px}
  #dlg.fullscreen .detail-tabs button{padding:8px 10px;font-size:.88rem}
  .dmode{right:82px}
}

.anime-refresh{align-self:flex-start;margin:10px 0 0;background:#0a0d18bb;border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--text);font-size:.82rem}
.anime-refresh:hover{border-color:var(--sun)}.anime-refresh:disabled{opacity:.6;cursor:wait}
.anime-refresh-status{margin-left:9px;color:var(--muted);font-size:.78rem}
.db{padding:6px 22px 22px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
video{width:100%;border-radius:8px;margin-top:8px;background:#000}
code{font-size:.8rem;color:var(--muted)}
a{color:var(--sun)}
/* Estatísticas pessoais */
.stats-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.stats-head p{margin:0;color:var(--muted);font-size:.88rem}
.stats-head button,.stats-refresh{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0 22px}
.stat-card{background:linear-gradient(145deg,#171e30,#111725);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stat-card small{display:block;color:var(--muted);font-size:.8rem}
.stat-card strong{display:block;font:600 1.8rem var(--serif);margin-top:4px;overflow-wrap:anywhere}
.stat-card span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.stats-section{margin:28px 0}
.stats-section h2{margin:0 0 12px}
.stats-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.stats-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stats-panel h3{font:600 1.08rem var(--serif);margin:0 0 14px}
.stat-line{display:grid;grid-template-columns:minmax(90px,1fr) minmax(80px,2fr) auto;gap:10px;align-items:center;margin:10px 0;font-size:.88rem}
.stat-line>span:first-child{overflow-wrap:anywhere}
.stat-track{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden}
.stat-track i{display:block;height:100%;background:var(--sun);border-radius:99px}
.stat-line b{font-size:.82rem;font-variant-numeric:tabular-nums}
.stat-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.stat-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid #ffffff0d;padding-bottom:7px;font-size:.88rem}
.stat-list li:last-child{border:0;padding-bottom:0}
.stat-list span{min-width:0;overflow-wrap:anywhere}.stat-list b{white-space:nowrap;font-variant-numeric:tabular-nums}
.stats-note{color:var(--muted);font-size:.78rem;margin:12px 0 0}
@media(max-width:560px){.stat-line{grid-template-columns:minmax(80px,1fr) minmax(50px,1.2fr) auto;gap:7px}.stat-card strong{font-size:1.55rem}}
/* Ranking musical */
.ranking-tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.ranking-tools select,.ranking-tools input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}
.ranking-tools input{flex:1;min-width:190px}
.ranking-summary{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.ranking-summary .stat-card{flex:1;min-width:145px}
.ranking-list{display:grid;gap:9px;padding:0;margin:0;list-style:none}
.ranking-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.ranking-position{font:700 1.35rem var(--serif);color:var(--gold);text-align:center}
.ranking-main{min-width:0}.ranking-main strong{display:block;overflow-wrap:anywhere}.ranking-main small{display:block;color:var(--muted);overflow-wrap:anywhere}
.ranking-links{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ranking-links button{background:none;border:0;color:var(--sun);padding:4px 0}.ranking-links a{white-space:nowrap}
@media(max-width:520px){.ranking-item{grid-template-columns:30px minmax(0,1fr);gap:9px}.ranking-links{grid-column:2;justify-content:flex-start}.ranking-position{font-size:1.1rem}}


.cp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.yr{margin:32px 0}
.yr h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.yb{background:none;border:0;padding:0;font:800 2.4rem/1 var(--serif);color:var(--gold)}
.yb:hover{color:var(--sun)}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:190px;padding:14px;border:0;border-radius:14px;text-align:left;overflow:hidden;background:#1a1f33 center/cover;box-shadow:0 8px 24px #0007;transition:transform .2s}
button.cell:hover{transform:translateY(-4px)}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0a0d18f5 25%,#0a0d1866)}
.cell>*{position:relative}
.cell b{font:600 1.05rem/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sn{position:relative!important;display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:auto;padding-bottom:12px}
.sn em{font-style:normal;color:var(--muted);font-weight:400;font-size:.8rem}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:#c3cbe0}.mini span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mini i{flex-shrink:0}
.mini i{font-style:normal;color:var(--gold)}
.cell.empty{background:none;border:1px dashed var(--line);box-shadow:none;justify-content:center;align-items:center}
.cell.empty::before{display:none}
@media(max-width:760px){.seasons{grid-template-columns:repeat(2,1fr)}}
input.sc{width:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.hidden{display:none}
@media(max-width:560px){.pod .info small{display:none}}


/* ============ REPAGINAÇÃO VISUAL — TESTE 01 ============ */
:root{
  --bg:#090c16;
  --panel:#111827;
  --line:rgba(164,178,211,.14);
  --text:#f2f3f8;
  --muted:#9aa6c1;
  --sun:#ff916b;
  --gold:#f1c879;
  --surface:rgba(18,25,41,.78);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{
  background:
    radial-gradient(ellipse at 82% 12%,rgba(85,65,125,.13),transparent 34rem),
    radial-gradient(ellipse at 8% 55%,rgba(38,75,111,.10),transparent 30rem),
    var(--bg);
  letter-spacing:.005em;
}
button{ -webkit-tap-highlight-color:transparent }
.hero{
  min-height:clamp(430px,59vh,620px);
  background-color:#11182a;
  background-position:center 35%;
  isolation:isolate;
}
.hero::before{
  background:
    linear-gradient(0deg,var(--bg) 0%,rgba(9,12,22,.82) 7%,rgba(9,12,22,.05) 60%),
    linear-gradient(90deg,rgba(7,10,19,.88) 0%,rgba(7,10,19,.58) 34%,rgba(7,10,19,.06) 78%),
    linear-gradient(180deg,rgba(7,10,19,.34),transparent 28%);
}
.top{
  padding:20px clamp(20px,4.2vw,64px);
  z-index:2;
}
.brand{font-size:1.38rem;letter-spacing:-.035em;text-shadow:0 2px 18px #0008}
.who{align-items:center;gap:9px}
.profile-chip{
  display:inline-flex;align-items:center;gap:7px;min-height:42px;
  padding:7px 16px;border:1px solid rgba(241,200,121,.28);
  border-radius:999px;background:rgba(10,13,24,.62);
  color:#c5cee2;font-size:.88rem;backdrop-filter:blur(16px);
}
.profile-chip strong{color:var(--gold);font-weight:600}
.who input,.who button{
  min-height:42px;
  background:rgba(10,13,24,.62);
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(16px);
  box-shadow:0 8px 28px rgba(0,0,0,.12);
  transition:border-color .2s,background .2s,transform .2s;
}
.who input{width:190px;padding-inline:16px}
.who button:hover{border-color:rgba(255,145,107,.72);background:rgba(20,25,40,.88);transform:translateY(-1px)}
.hero-in{max-width:900px;padding:0 clamp(20px,4.2vw,64px) 54px}
.hero-in small{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 11px;border:1px solid rgba(241,200,121,.28);
  border-radius:999px;background:rgba(8,11,20,.42);backdrop-filter:blur(10px);
  color:var(--gold);font-size:.82rem;letter-spacing:.025em;
}
.hero-in h1{
  max-width:850px;
  font-size:clamp(2.8rem,6.2vw,5.6rem);
  letter-spacing:-.045em;
  line-height:.98;
  margin:15px 0 13px;
  text-wrap:balance;
}
.hero-in p{font-size:.98rem;color:#d7dced;margin-bottom:20px}
.go{
  padding:12px 22px;border-radius:999px;
  box-shadow:0 8px 28px rgba(255,145,107,.2);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.go:hover{transform:translateY(-2px);background:#ffa17f;box-shadow:0 12px 32px rgba(255,145,107,.27)}
.wrap{max-width:1320px;padding:0 clamp(20px,4.2vw,64px) 100px}
#sub{
  display:inline-flex;align-items:center;min-height:34px;
  margin:4px 0 8px;padding:5px 11px;
  border:1px solid var(--line);border-radius:999px;
  background:rgba(17,24,39,.55);font-size:.82rem;
}
#me{margin:0 0 22px;font-size:.78rem;overflow-wrap:anywhere}
#me code{color:#c0c9df}
.tabs{
  position:sticky;top:0;z-index:5;
  gap:6px;margin:8px 0 25px;padding:8px;
  border:1px solid rgba(164,178,211,.12);border-radius:15px;
  background:rgba(9,12,22,.82);backdrop-filter:blur(18px);
  box-shadow:0 12px 32px rgba(0,0,0,.14);
  scrollbar-width:thin;
}
.tabs button{
  position:relative;border:0;border-radius:10px;
  padding:10px 17px;color:#aab4cb;
  transition:color .2s,background .2s;
}
.tabs button:hover{color:var(--text);background:rgba(255,255,255,.045)}
.tabs button[aria-selected=true]{color:#fff;background:rgba(255,145,107,.11)}
.tabs button[aria-selected=true]::after{
  content:"";position:absolute;left:17px;right:17px;bottom:3px;height:2px;
  border-radius:2px;background:var(--sun);
}
h2{font-size:1.72rem;letter-spacing:-.025em;margin:38px 0 17px}
.sub{color:#b3bfd8}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.poster{
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.24);
  transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
}
.poster:hover{
  transform:translateY(-6px) scale(1.012);
  border-color:rgba(255,145,107,.48);
  box-shadow:0 18px 42px rgba(0,0,0,.34);
}
.poster .cap{padding:48px 12px 12px;background:linear-gradient(0deg,rgba(4,6,13,.98),rgba(4,6,13,.68) 48%,transparent)}
.poster .cap b{font-size:.93rem;letter-spacing:-.01em}
.poster .cap span{font-size:.79rem}
.wides{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:17px}
.wide{
  min-height:166px;padding:16px;border:1px solid rgba(255,255,255,.07);
  border-radius:16px;background-position:center;background-size:cover;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.wide:hover{transform:translateY(-3px);border-color:rgba(255,145,107,.42);box-shadow:0 17px 36px rgba(0,0,0,.3)}
.wide::before{background:linear-gradient(90deg,rgba(7,10,19,.96) 22%,rgba(7,10,19,.75) 58%,rgba(7,10,19,.28))}
.wide img{width:86px;border:1px solid rgba(255,255,255,.13);border-radius:9px}
.wide b{font-size:1.22rem;letter-spacing:-.02em}
.pb{height:4px;background:rgba(255,255,255,.18)}

};

 status progress score(format:POINT_100)
 media{id siteUrl season seasonYear episodes status bannerImage coverImage{extraLarge large} title{romaji english}}}}}}`;
const TIERS=[[100,"Masterpiece","#f2c46d"],[95,"Almost Perfect","#ff7a4d"],[90,"Excellent","#f5a63c"],[85,"Very Good","#7ac36a"],
 [80,"Good","#4aa8e0"],[75,"Decent","#98a2bd"],[70,"Average","#a89fb5"],[60,"Bad","#d98a3a"],[0,"Very Bad","#c0453f"]];

const badge=s=>{const t=tier(s);return `<span class="tier" style="--c:${t[2]}">${s}<small>${t[1]}</small></span>`};

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const getAnimeUrlId=()=>{
  const value=new URLSearchParams(location.search).get("anime");
  return value&&/^\d+$/.test(value)&&Number(value)>0?Number(value):null;
};

  const id=getAnimeUrlId();if(id==null)return;
  initialAnimeUrlHandled=true;
  updateAnimeUrl(id,{state:{hubAnimeId:id,hubAnimeFullscreen:true,hubAnimeDirect:true,hubAnimeFromCompact:false}});
  openAnime(id,{fullscreen:true,fromUrl:true});
}
const themeCache=new Map();
const PROVISIONAL_THEME_SLUGS={OP:"provisional_op",ED:"provisional_ed"};
const themeTypeFromSlug=slug=>{const value=String(slug||"");if(value===PROVISIONAL_THEME_SLUGS.OP)return "OP";if(value===PROVISIONAL_THEME_SLUGS.ED)return "ED";return value.toUpperCase().match(/^(OP|ED)/)?.[1]||""};
const isProvisionalThemeSlug=slug=>Object.values(PROVISIONAL_THEME_SLUGS).includes(slug);

async function fetchList(user){
  const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QUERY,variables:{u:user}})});
  const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
  const seen=new Map();
  j.data.MediaListCollection.lists.forEach(l=>l.entries.forEach(e=>{if(!seen.has(e.media.id))seen.set(e.media.id,e)}));
  return [...seen.values()].map(e=>({id:e.media.id,title:e.media.title.english||e.media.title.romaji,
    cover:e.media.coverImage.extraLarge||e.media.coverImage.large,banner:e.media.bannerImage,url:e.media.siteUrl,
    season:e.media.season,year:e.media.seasonYear,eps:e.media.episodes,airing:e.media.status,
    status:e.status,progress:e.progress,score:e.score}));
}
async function fetchThemes(id){
  if(themeCache.has(id)) return themeCache.get(id);
  const r=await fetch(`https://api.animethemes.moe/anime?filter[has]=resources&filter[site]=AniList&filter[external_id]=${id}&include=animethemes.animethemeentries.videos,animethemes.song.artists`);
  if(!r.ok)throw new Error(`AnimeThemes HTTP ${r.status}`);
  const j=await r.json();
  if(!j||!Array.isArray(j.anime))throw new Error("Resposta inválida do AnimeThemes");
  const th=(j.anime[0]?.animethemes||[]).map(t=>({slug:t.slug,type:t.type,title:t.song?.title||"(sem título)",
    artist:(t.song?.artists||[]).map(a=>a.name).join(", "),eps:t.animethemeentries?.[0]?.episodes||"",
    video:(t.animethemeentries?.[0]?.videos||[]).sort((a,b)=>(b.resolution||0)-(a.resolution||0))[0]?.link}));
  // Não guardar respostas vazias: uma falha/retorno transitório não deve virar cache permanente nesta sessão.
  if(th.length)themeCache.set(id,th);
  return th;
}

const filtered = l => {
  const y = $("year").value;

    return matchYear && matchSeason && matchQuery;
  });
};

}

async function renderHall(){
  $("view").innerHTML='<div class="msg">Carregando notas das músicas…</div>';
  try{
    const scores=await hubFB.getSongScores();
    Object.keys(SONG_SCORES).forEach(k=>delete SONG_SCORES[k]);Object.assign(SONG_SCORES,scores);
  }catch(e){
    $("view").innerHTML=`<div class="msg err">Não consegui carregar as notas das músicas (${esc(e.code||e.message)}).</div>`;return;
  }
  const keys=Object.keys(SONG_SCORES);
  if(!keys.length){$("view").innerHTML='<div class="msg">Ainda não há músicas com nota.</div>';return}
  const ids=[...new Set(keys.map(k=>Number(k.split(":")[0])).filter(Number.isFinite))],catalogs=new Map();
  let offlineCount=0,apiFailureCount=0;
  await Promise.all(ids.map(async id=>{
    let themes=[];
    try{themes=await fetchThemes(id)}catch(e){apiFailureCount++;/* usa o catálogo salvo abaixo */}
    if(!themes.length){
      try{
        const note=await hubFB.getAnimeNote(id);
        if(Array.isArray(note?.themeCatalog)&&note.themeCatalog.length){themes=note.themeCatalog;offlineCount++;}
      }catch(e){}
    }
    catalogs.set(id,new Map(themes.map(t=>[t.slug,t])));
  }));
  // Monta o ranking a partir das notas salvas, não da lista retornada pela API.
  // Assim, mesmo sem metadados, OP1/ED1 continuam aparecendo com sua nota.
  const items=[];
  keys.forEach(key=>{
    const cut=key.indexOf(":");if(cut<1)return;
    const id=Number(key.slice(0,cut)),slug=key.slice(cut+1),score=SONG_SCORES[key];
    if(!Number.isFinite(id)||score==null)return;
    const theme=catalogs.get(id)?.get(slug),a=byId(id);
    const inferredType=themeTypeFromSlug(slug);
    const type=theme?.type||inferredType;
    items.push({type,season:a?.season,year:a?.year,id,cover:a?.cover||"",title:theme?.title||(isProvisionalThemeSlug(slug)?`${inferredType} provisória`:slug),
      sub:`${theme?.artist?theme.artist+" · ":""}${a?.title||"Anime "+id}`,score,song:true});
  });
  const selected=items.filter(i=>i.type===$("type").value);
  const l=filtered(selected).sort((a,b)=>b.score-a.score).slice(0,+$("limit").value);
  const notice=apiFailureCount?`<p class="meta">AnimeThemes falhou ao responder para ${apiFailureCount} anime(s). O ranking está usando listas salvas e, quando necessário, os códigos OP/ED das suas avaliações.</p>`:(offlineCount?`<p class="meta">O ranking está usando listas de músicas salvas anteriormente para ${offlineCount} anime(s).</p>`:"");
  const genericCount=l.filter(i=>!catalogs.get(i.id)?.has(i.title) && i.title===i.title.toUpperCase() && /^(OP|ED)\d*$/i.test(i.title)).length;
  const genericNotice=genericCount?'<p class="meta">Algumas músicas aparecem pelo código (OP1, ED1 etc.) porque os títulos não estão disponíveis no momento.</p>':"";
  $("view").innerHTML=notice+genericNotice+ranking(l);
}

function renderThemeList(id,th,note,offline=false){
  const root=$("themes"),comments=note?.themeComments||{},themes=Array.isArray(th)?th:[];
  root.className="";
  const realSlugs=new Set(themes.map(t=>t.slug));
  const scoreSlugs=Object.keys(SONG_SCORES).filter(key=>key.startsWith(`${id}:`)).map(key=>key.slice(String(id).length+1));
  const savedOrphans=[...new Set([...Object.keys(comments),...scoreSlugs])].filter(slug=>!realSlugs.has(slug)&&!isProvisionalThemeSlug(slug));
  const orphanTypes=new Set(savedOrphans.map(themeTypeFromSlug).filter(Boolean));
  const provisionalKinds=offline&&!themes.length?["OP","ED"].filter(kind=>!orphanTypes.has(kind)):[];
  const hasSavedProvisional=Object.entries(PROVISIONAL_THEME_SLUGS).some(([kind,slug])=>
    Object.prototype.hasOwnProperty.call(comments,slug)||SONG_SCORES[`${id}:${slug}`]!=null);
  const provisionalKindsToRender=[...new Set([...provisionalKinds,...(hasSavedProvisional?Object.keys(PROVISIONAL_THEME_SLUGS).filter(kind=>Object.prototype.hasOwnProperty.call(comments,PROVISIONAL_THEME_SLUGS[kind])||SONG_SCORES[`${id}:${PROVISIONAL_THEME_SLUGS[kind]}`]!=null):[])])];
  const renderCard=(t,{provisional=false,orphan=false,label=""}={})=>{
    const key=`${id}:${t.slug}`,sc=SONG_SCORES[key],comment=comments[t.slug]||"";
    const title=provisional?`${t.type} provisória`:t.title||t.slug;
    const meta=provisional?"Cadastro temporário · sem identificação da música":(orphan?"Informações da música indisponíveis":"");
    let association="";
    if(provisional&&!offline&&themes.length&&fbUser){
      association=`<div class="theme-comment-wrap"><label for="associate-${t.type}">Quando a API voltou, escolha a música correspondente para transferir sua avaliação:</label><select id="associate-${t.type}" style="width:100%;background:#0c1220;border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--text)"><option value="">Selecione uma música…</option>${themes.filter(x=>x.type===t.type).map(x=>`<option value="${esc(x.slug)}">${esc(x.title||x.slug)}${x.artist?` — ${esc(x.artist)}`:""}</option>`).join("")}</select><button class="theme-comment-save" data-associate-provisional="${t.type}">Associar avaliação</button><span class="experience-status" id="associate-status-${t.type}"></span></div>`;
    }
    const kind=themeTypeFromSlug(t.slug)||String(t.type||"").toUpperCase();
    const kindBadge=!provisional&&label?`<span class="theme-kind-badge ${kind.toLowerCase()}">${esc(label)}</span>`:"";
    return `<div class="theme ${provisional?"theme-provisional":""}"><b>${esc(title)}</b>${kindBadge} ${!provisional&&t.title?`<span class="meta">${esc(t.artist||"")}${t.eps?" · eps "+esc(t.eps):""}</span>`:`<span class="meta">${esc(meta)}</span>`} ${sc!=null?sbadge(sc):""}
      ${t.video&&!offline?`<video controls preload="none" src="${esc(t.video)}"></video>`:""}
      ${fbUser?`<div style="margin-top:8px"><label class="meta" for="sc-${key}">Nota (opcional)</label><input class="sc" id="sc-${key}" type="text" inputmode="decimal" placeholder="0 a 10" value="${sc??""}"> <button class="cp" data-save="${key}">Salvar nota</button> <code id="st-${key}"></code></div><div class="theme-comment-wrap"><label for="tc-${key}">Minha impressão sobre esta música (opcional)</label><textarea class="theme-comment" id="tc-${key}" maxlength="5000" placeholder="O que achou da música, animação, cenas…">${esc(comment)}</textarea><button class="theme-comment-save" data-save-theme-comment="${esc(t.slug)}">Salvar comentário</button> <span class="experience-status" id="tcs-${key}"></span></div>${association}`:(comment?`<div class="theme-comment-wrap public-theme-comment"><span class="meta">Minha impressão</span><p style="white-space:pre-wrap;margin:8px 0 0">${esc(comment)}</p></div>`:"")}</div>`;
  };
  const typeCounters={OP:0,ED:0};
  const cards=themes.map(t=>{
    const kind=themeTypeFromSlug(t.slug)||String(t.type||"").toUpperCase();
    if(kind==="OP"||kind==="ED")typeCounters[kind]++;
    const label=(kind==="OP"||kind==="ED")?`${kind}${typeCounters[kind]}`:"";
    return renderCard(t,{label});
  });
  // Comentários de músicas antigas que não estão no catálogo atual continuam acessíveis.
  savedOrphans.forEach(slug=>{
    const kind=themeTypeFromSlug(slug);if(!kind)return;
    cards.push(renderCard({slug,type:kind,title:slug,artist:"",video:""},{orphan:true,label:slug}));
  });
  provisionalKindsToRender.forEach(kind=>{
    const slug=PROVISIONAL_THEME_SLUGS[kind];
    cards.push(renderCard({slug,type:kind,title:`${kind} provisória`,artist:"",video:""},{provisional:true}));
  });
  if(!cards.length){
    root.innerHTML=`<div class="msg">${offline?"AnimeThemes indisponível e ainda não há catálogo salvo. Você pode começar com uma avaliação provisória de OP e ED.":"O AnimeThemes não tem OP/ED cadastrado pra esse anime."}</div>`;
    if(offline){
      // As duas entradas temporárias aparecem apenas durante a indisponibilidade, quando não há catálogo salvo.
      root.innerHTML='<p class="meta">AnimeThemes indisponível. Você pode registrar uma avaliação provisória de cada tipo; quando a API voltar, poderá associá-las às músicas reais.</p>'+["OP","ED"].map(kind=>renderCard({slug:PROVISIONAL_THEME_SLUGS[kind],type:kind,title:kind,artist:"",video:""},{provisional:true})).join("");
    }
    return;
  }
  const intro=offline?'<p class="meta">AnimeThemes indisponível. Exibindo o catálogo salvo e suas anotações; os vídeos voltarão quando a API estiver disponível.</p>':(provisionalKindsToRender.length?'<p class="meta">A API voltou. Suas avaliações provisórias foram preservadas; associe cada uma à música correta para transferi-las.</p>':(savedOrphans.length?'<p class="meta">Algumas anotações antigas não foram encontradas no catálogo atual e continuam disponíveis abaixo.</p>':""));
  root.innerHTML=intro+cards.join("");
}

async function openAnime(id,{fullscreen=false,fromUrl=false}={}){
  const a=byId(id),d=$("dlg"),wasOpen=d.open,wasFullscreen=d.classList.contains("fullscreen");activeDiaryAnime=id;window.activeDiaryAnime=id;
  if(!wasOpen&&!fromUrl){
    updateAnimeUrl(null,{state:{hubCompactAnime:id,hubAnimeId:null,hubAnimeFullscreen:false,hubAnimeDirect:false,hubAnimeFromCompact:false}});
  }
  let note={};try{note=await hubFB.getAnimeNote(id)}catch(e){}
  
  // Selo visual da nota provisória para o cabeçalho (compatível com registros antigos).
  const headerProvisionalScore = note?.provisionalScore;
  const provBadge = headerProvisionalScore !== null && headerProvisionalScore !== undefined && Number.isFinite(Number(headerProvisionalScore))
    ? `<span class="tier provisional-rating-badge" style="--c:var(--gold)">${esc(headerProvisionalScore)} <small>Provisória</small></span>`
    : (note?.provisionalTier ? `<span class="tier provisional-rating-badge" style="--c:var(--gold)">${esc(note.provisionalTier)} <small>Provisória antiga</small></span>` : '');

  d.innerHTML=`<div class="dh" ${bg(a?.banner||a?.cover)}><button type="button" class="dmode" data-dialog-mode aria-label="Expandir para tela cheia" title="Expandir para tela cheia">⛶</button><button class="dx" onclick="dlg.close()">Fechar</button><h2>${esc(a?.title||"Anime "+id)}</h2>
   <div class="meta">${a?when(a):""} ${a?.score?badge(a.score):""} ${provBadge} · <a href="${a?.url||"https://anilist.co/anime/"+id}" target="_blank" rel="noopener">AniList</a></div>
   <div><button type="button" class="anime-refresh" data-refresh-anime="${id}">↻ Atualizar dados deste anime</button><span class="anime-refresh-status" id="anime-refresh-status" role="status"></span></div></div>
   <div class="db"><div class="detail-tabs"><button type="button" data-detail-tab="themes" aria-selected="true">OP e ED</button><button type="button" data-detail-tab="experience" aria-selected="false">Minha experiência</button><button type="button" data-detail-tab="diary" aria-selected="false">Diário de episódios</button></div>
   <section id="detail-themes"><div id="themes" class="msg">Carregando músicas e comentários salvos…</div></section>
   <section id="detail-experience" class="hidden"><div id="experience-content" class="msg">Carregando…</div></section>
   <section id="detail-diary" class="hidden"><div id="diary-content" class="msg">Carregando diário…</div></section></div>`;
  if(!d.open)d.showModal();
  if(fullscreen||wasFullscreen)d.classList.add("fullscreen");else d.classList.remove("fullscreen");
  const modeControl=d.querySelector("[data-dialog-mode]");
  if(modeControl){
    const expanded=d.classList.contains("fullscreen");
    modeControl.textContent=expanded?"↙":"⛶";
    modeControl.setAttribute("aria-label",expanded?"Voltar à janela compacta":"Expandir para tela cheia");
    modeControl.title=expanded?"Voltar à janela compacta":"Expandir para tela cheia";
  }
  let apiAvailable=false;
  try{
    const th=await fetchThemes(id);apiAvailable=true;
    // Se a API responder sem catálogo e o cache local não tiver metadados,
    // tenta recuperar a cópia persistida no Firestore antes de mostrar OP1/ED1.
    if(!th.length&&(!Array.isArray(note.themeCatalog)||!note.themeCatalog.length)){
      try{note=await hubFB.getAnimeNote(id,{refresh:true})}catch(e){console.warn("Não foi possível atualizar o catálogo salvo de OP/ED",e)}
    }
    const themeList=th.length?th:(note.themeCatalog||[]);
    // Backfill do catálogo no Firestore somente quando a lista mudou e a conta proprietária está conectada.
    if(th.length&&fbUser){
      const clean=th.map(t=>({slug:t.slug,type:t.type,title:t.title,artist:t.artist,eps:t.eps||"",video:t.video||""}));
      if(JSON.stringify(clean)!==JSON.stringify(note.themeCatalog||[])){
        try{await hubFB.saveThemeCatalog(id,th);note={...note,themeCatalog:clean}}catch(e){console.warn("Não foi possível salvar o catálogo de OP/ED",e)}
      }
    }
    const slugs=[...new Set([...themeList.map(t=>t.slug),...Object.keys(note.themeComments||{}),...Object.values(PROVISIONAL_THEME_SLUGS)])];
    if(slugs.length){try{Object.assign(SONG_SCORES,await hubFB.getSongScoresForAnime(id,slugs))}catch(e){}}
    renderThemeList(id,themeList,note,false);
  }catch(e){
    // Em caso de indisponibilidade da AnimeThemes, não confia apenas no cache:
    // se ele não tiver catálogo, consulta o Firestore diretamente (sem TTL).
    if(!Array.isArray(note.themeCatalog)||!note.themeCatalog.length){
      try{note=await hubFB.getAnimeNote(id,{refresh:true})}catch(refreshError){console.warn("Não foi possível recuperar o catálogo salvo no Firestore",refreshError)}
    }
    const themeList=Array.isArray(note.themeCatalog)?note.themeCatalog:[];
    const slugs=[...new Set([...themeList.map(t=>t.slug),...Object.keys(note.themeComments||{}),...Object.values(PROVISIONAL_THEME_SLUGS)])];
    if(slugs.length){try{Object.assign(SONG_SCORES,await hubFB.getSongScoresForAnime(id,slugs))}catch(ignore){}}
    renderThemeList(id,themeList,note,true);
  }
  loadDiary(id);loadExperience(id);
}

async function refreshOpenAnimeData(id,button){
  const status=$("anime-refresh-status");
  if(!button||button.disabled||activeDiaryAnime!==id)return;
  button.disabled=true;button.textContent="Atualizando…";if(status)status.textContent="Buscando dados atuais no Firestore…";

async function renderRanking(){
  if(rankingLoading)return;rankingLoading=true;
  $("view").innerHTML='<div class="msg">Montando seu ranking musical…</div>';
  try{
    const [notes,scores]=await Promise.all([hubFB.getAllAnimeNotes(),hubFB.getSongScores()]);
    const catalogByAnime=new Map(Object.entries(notes||{}).map(([id,n])=>[String(id),Array.isArray(n?.themeCatalog)?n.themeCatalog:[]]));
    const tracks=[];
    Object.entries(scores||{}).forEach(([key,rawScore])=>{
      const cut=key.indexOf(":");if(cut<1||!Number.isFinite(Number(rawScore)))return;
      const id=key.slice(0,cut),slug=key.slice(cut+1);
      if(isProvisionalThemeSlug(slug))return;
      const theme=(catalogByAnime.get(id)||[]).find(t=>t.slug===slug);
      if(!theme||!['OP','ED'].includes(String(theme.type||themeTypeFromSlug(slug)).toUpperCase())||!String(theme.title||'').trim())return;
      const anime=byId(Number(id));
      const rawVideo=String(theme.video||'').trim(),video=/^https?:\/\//i.test(rawVideo)?rawVideo:'';
      tracks.push({id,slug,type:String(theme.type||themeTypeFromSlug(slug)).toUpperCase(),score:Number(rawScore),title:String(theme.title).trim(),artist:String(theme.artist||'').trim(),anime:anime?.title||`Anime ${id}`,video});
    });
    tracks.sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title,'pt-BR'));
    const opCount=tracks.filter(t=>t.type==='OP').length,edCount=tracks.filter(t=>t.type==='ED').length;
    const average=list=>list.length?(list.reduce((sum,t)=>sum+t.score,0)/list.length).toFixed(2).replace('.',','):'—';
    const renderList=(type='ALL',query='')=>{
      const q=query.trim().toLocaleLowerCase('pt-BR');
      const filtered=tracks.filter(t=>(type==='ALL'||t.type===type)&&(!q||[t.title,t.artist,t.anime].some(v=>v.toLocaleLowerCase('pt-BR').includes(q))));
      if(!filtered.length)return '<div class="msg">Nenhuma música encontrada com esses filtros.</div>';
      return `<ol class="ranking-list">${filtered.map((t,i)=>`<li class="ranking-item"><span class="ranking-position">${i+1}</span><div class="ranking-main"><strong>${esc(t.title)} <span class="meta">· ${t.score.toLocaleString('pt-BR')}/10</span></strong><small>${esc(t.artist||'Artista não identificado')} · ${t.type} · ${esc(t.anime)}</small></div><div class="ranking-links"><button type="button" data-ranking-anime="${esc(t.id)}">Ver anime</button>${t.video?`<a href="${esc(t.video)}" target="_blank" rel="noopener noreferrer">Assistir ↗</a>`:''}</div></li>`).join('')}</ol>`;
    };
    const html=`<div class="stats-head"><p>Suas músicas avaliadas, ordenadas da maior para a menor nota. Empates ficam em sequência.</p><button type="button" id="ranking-refresh">Atualizar dados</button></div>
      <div class="ranking-summary"><article class="stat-card"><small>OPs no ranking</small><strong>${opCount}</strong><span>Média: ${average(tracks.filter(t=>t.type==='OP'))}/10</span></article><article class="stat-card"><small>EDs no ranking</small><strong>${edCount}</strong><span>Média: ${average(tracks.filter(t=>t.type==='ED'))}/10</span></article><article class="stat-card"><small>Total de músicas</small><strong>${tracks.length}</strong><span>Somente músicas reais identificadas</span></article></div>
      <div class="ranking-tools"><select id="ranking-type" aria-label="Tipo de música"><option value="ALL">OPs e EDs</option><option value="OP">Somente OPs</option><option value="ED">Somente EDs</option></select><input id="ranking-search" type="search" placeholder="Buscar música, artista ou anime…" aria-label="Buscar no ranking"></div>
      <div id="ranking-results">${renderList()}</div>
      <p class="stats-note">Avaliações provisórias ou músicas sem catálogo identificado não aparecem aqui. Elas continuam salvas e podem ser associadas quando o AnimeThemes estiver disponível.</p>`;
    $("view").innerHTML=html;
    const update=()=>{$("ranking-results").innerHTML=renderList($("ranking-type").value,$("ranking-search").value);};
    $("ranking-type").addEventListener('change',update);$("ranking-search").addEventListener('input',update);
    $("ranking-refresh").addEventListener('click',async()=>{await hubFB.getAllAnimeNotes({refresh:true});await cacheDelete('songScores');rankingLoading=false;await renderRanking();});
    $("ranking-results").addEventListener('click',e=>{const b=e.target.closest('[data-ranking-anime]');if(b)openAnime(Number(b.dataset.rankingAnime));});
  }catch(e){$("view").innerHTML=`<div class="msg err">Não consegui montar o ranking (${esc(e.code||e.message)}). Confira sua conexão e se as regras do Firestore permitem leitura pública.</div>`;}
  finally{rankingLoading=false;}
}

function updateAniListConnectionUI(){
  const status=$("anilist-connection-status"),meta=$("anilist-connection-meta"),connect=$("anilist-connect"),disconnect=$("anilist-disconnect"),retry=$("anilist-retry");
  if(!status||!connect||!disconnect||!retry)return;
  const state=anilistStatus.kind;
  status.textContent=({
    checking:"Verificando conexão com AniList…",
    unauthenticated:"Entre com a conta Google proprietária para verificar ou conectar o AniList.",
    disconnected:"Nenhuma conta AniList conectada.",
    connected:`Conectado como ${anilistStatus.accountName||"conta AniList"}.`,
    expired:`A conexão de ${anilistStatus.accountName||"sua conta AniList"} está expirada. Reconecte para voltar a utilizá-la.`,
    error:"Não foi possível verificar a conexão com AniList."
  })[state]||"Estado da conexão indisponível.";
  const expiry=anilistStatus.expiresAt;
  meta.textContent=state==="connected"||state==="expired"?(expiry!==null&&expiry!==undefined?`Expiração informada pelo Worker: ${String(expiry)}`:""):"";
  connect.textContent=state==="expired"?"Reconectar AniList":"Conectar AniList";
  connect.classList.toggle("hidden",state==="connected");
  connect.disabled=!fbUser||anilistBusy||state==="checking";
  disconnect.classList.toggle("hidden",!fbUser||!(state==="connected"||state==="expired"));
  disconnect.disabled=!fbUser||anilistBusy;
  retry.classList.toggle("hidden",!fbUser||state!=="error");
  retry.disabled=!fbUser||anilistBusy;
}
function callbackFeedback(code){
  const messages={
    connected:"O AniList retornou ao Hub. Verificando a conexão diretamente no Worker…",
    denied:"A autorização do AniList foi cancelada ou negada.",
    invalid_callback:"O Worker informou que o retorno OAuth é inválido.",
    invalid_state:"O Worker rejeitou o estado OAuth. Tente iniciar a conexão novamente.",
    token_error:"O Worker não conseguiu concluir a troca do código OAuth por um token.",
    verification_error:"O Worker não conseguiu verificar a conta AniList autorizada.",
    configuration_error:"O Worker informou um problema de configuração na integração OAuth."
  };
  return messages[code]||"O AniList retornou uma resposta de autenticação.";
}
function removeAniListCallbackParams(){
  const url=new URL(location.href);url.searchParams.delete("anilist");url.searchParams.delete("account");
  history.replaceState(history.state,"",url);
}
async function refreshAniListStatus({silent=false}={}){
  if(!fbUser||!window.hubFB?.getAniListStatus){
    anilistStatus={kind:"unauthenticated"};updateAniListConnectionUI();return null;
  }
  const uid=fbUser.uid;anilistStatus={kind:"checking"};updateAniListConnectionUI();
  if(!silent)setAniListFeedback("Consultando o estado da conexão…");
  try{
    const result=await window.hubFB.getAniListStatus();
    if(fbUser?.uid!==uid)return null;
    if(!result||typeof result.connected!=="boolean")throw new Error("Resposta de status inválida.");
    if(result.connected){
      anilistStatus={kind:result.expired?"expired":"connected",accountName:typeof result.accountName==="string"?result.accountName:"",savedAt:result.savedAt||null,expiresAt:result.expiresAt||null};
    }else anilistStatus={kind:"disconnected"};
    updateAniListConnectionUI();
    if(!silent)setAniListFeedback(anilistStatus.kind==="connected"?"Conexão verificada com sucesso.":anilistStatus.kind==="expired"?"A conexão existe, mas o token expirou.":"Nenhuma conta AniList está conectada.");
    return anilistStatus;
  }catch(err){
    if(fbUser?.uid!==uid)return null;
    console.warn("Falha ao consultar o estado OAuth do AniList",err);
    anilistStatus={kind:"error"};updateAniListConnectionUI();
    if(!silent)setAniListFeedback("Não foi possível consultar o Worker. Verifique sua conexão e tente novamente.","error");
    return anilistStatus;
  }
}
async function handleAniListCallback(){
  if(!anilistCallback||anilistCallbackHandled)return;
  anilistCallbackHandled=true;
  setAniListFeedback(callbackFeedback(anilistCallback.code),anilistCallback.code==="connected"?"":"error");
  removeAniListCallbackParams();
  if(!fbUser){
    anilistStatus={kind:"unauthenticated"};updateAniListConnectionUI();
    setAniListFeedback("Retorno do AniList recebido, mas não foi possível verificar a conexão. Entre com a conta Google proprietária e tente verificar novamente.","error");
    return;
  }
  const checked=await refreshAniListStatus({silent:true});
  if(anilistCallback.code==="connected"){
    if(checked?.kind==="connected")setAniListFeedback(`Conexão confirmada pelo Worker${checked.accountName?` para ${checked.accountName}`:""}.`);
    else setAniListFeedback("O retorno informou sucesso, mas o Worker não confirmou uma conexão ativa. Use Verificar novamente ou tente conectar outra vez.","error");
  }
}

function showImportPreview(preview,backup){
  const dialog=$("import-preview-dialog");
  const labels={animeCatalog:"Catálogo de animes",animeNotes:"Anotações e avaliações",episodeLogs:"Diário de episódios",songScores:"Notas das músicas"};
  const status={add:{label:"Será adicionado",className:"add"},ignore:{label:"Já existe · ignorado",className:""},attention:{label:"Conflito · preservado",className:"attention"}};
  const total=preview.summary;
  const groups=Object.keys(labels).map(name=>{
    const items=preview.items.filter(item=>item.section===name);
    const added=items.filter(item=>item.action==="add").length;
    const ignored=items.filter(item=>item.action==="ignore").length;
    const attention=items.filter(item=>item.action==="attention").length;
    const visibleItems=items.slice(0,60);
    const rows=items.length?visibleItems.map(item=>{
      const st=status[item.action];
      const extra=item.action==="attention"?`<small>Diferenças: ${esc(item.differences.join(", "))}</small>`:"";
      return `<div class="import-preview-item"><div><strong>${esc(item.label)}</strong>${extra}</div><span class="import-preview-tag ${st.className}">${st.label}</span></div>`;
    }).join("")+(items.length>visibleItems.length?`<div class="import-preview-empty">Mais ${items.length-visibleItems.length} registros nesta seção; todos foram considerados nos totais.</div>`:""):'<div class="import-preview-empty">Nenhum registro nesta seção.</div>';
    return `<details ${items.length&&items.some(item=>item.action==="attention")?"open":""}><summary><span>${labels[name]}</span><span class="import-preview-group-count">${added} novos · ${ignored} iguais · ${attention} conflitos</span></summary><div class="import-preview-items">${rows}</div></details>`;
  }).join("");
  const sourceUid=backup.user?.uid||"não informado";
  dialog.innerHTML=`<div class="import-preview"><div class="import-preview-head"><div><h2 id="import-preview-title">Prévia da importação</h2><p>Backup de ${esc(backup.exportedAt||"data não informada")} · origem: ${esc(sourceUid)}</p></div><button type="button" class="import-preview-close" data-import-cancel aria-label="Fechar prévia">Fechar</button></div><div class="import-preview-summary"><div class="import-preview-stat add"><strong>${total.add}</strong><span>Novos registros</span></div><div class="import-preview-stat"><strong>${total.ignore}</strong><span>Registros iguais</span></div><div class="import-preview-stat attention"><strong>${total.attention}</strong><span>Precisam de atenção</span></div></div><p class="import-preview-note">Importação segura: somente registros que ainda não existem serão adicionados. Registros existentes nunca serão sobrescritos. Conflitos e registros iguais serão ignorados, preservando integralmente os dados atuais do Hub.</p><div class="import-preview-groups">${groups}</div><div class="import-preview-actions"><button type="button" data-import-cancel>Cancelar</button><button type="button" class="primary" data-import-confirm ${total.add===0?"disabled":""}>Adicionar ${total.add} ${total.add===1?"registro novo":"registros novos"}</button></div></div>`;
  return new Promise(resolve=>{
    let settled=false;
    const onCancel=event=>{event.preventDefault();finish(false)};
    const finish=value=>{
      if(settled)return;settled=true;
      dialog.removeEventListener("cancel",onCancel);
      if(dialog.open)dialog.close();
      dialog.innerHTML="";
      resolve(value);
    };
    dialog.querySelectorAll("[data-import-cancel]").forEach(button=>button.addEventListener("click",()=>finish(false)));
    dialog.querySelector("[data-import-confirm]").addEventListener("click",()=>finish(true));
    dialog.addEventListener("cancel",onCancel);
    dialog.showModal();
  });
}

async function anilistWorkerRequest(path,method="GET"){
  requireOwner();

  getAnimeCatalog:async username=>{
    if(!auth.currentUser)throw new Error("Faça login para consultar seu catálogo salvo.");
    const ref=collection(db,"users",auth.currentUser.uid,"animeCatalog");
    const matches=snap=>snap.docs.filter(d=>Number.isFinite(Number(d.id))).map(d=>({id:Number(d.id),...d.data()})).filter(a=>(a.anilistUser||"").toLowerCase()===username.toLowerCase()&&a.inList!==false);
    let snap,source="server";
    try{snap=await getDocsFromServer(ref)}
    catch(serverError){source="cache";try{snap=await getDocsFromCache(ref)}catch(cacheError){return {items:[],source:"empty",error:serverError,lastSyncedAt:null}}}
    let meta=null;const metaRef=doc(db,"users",auth.currentUser.uid,"animeCatalog","_meta");
    try{const m=source==="server"?await getDoc(metaRef):await getDocFromCache(metaRef);if(m.exists()&&(m.data().anilistUser||"").toLowerCase()===username.toLowerCase())meta=m.data()}
    catch(e){try{const m=await getDocFromCache(metaRef);if(m.exists()&&(m.data().anilistUser||"").toLowerCase()===username.toLowerCase())meta=m.data()}catch(ignore){}}
    return {items:matches(snap),source,lastSyncedAt:meta?.lastSyncedAt||null};
  },
  saveAnimeCatalog:async(username,items)=>{
    if(!auth.currentUser)throw new Error("Faça login para salvar seu catálogo.");
    const uid=auth.currentUser.uid,ref=collection(db,"users",uid,"animeCatalog");
    let existing=[];try{const snap=await getDocsFromServer(ref);existing=snap.docs.filter(d=>d.id!=="_meta"&&(d.data().anilistUser||"").toLowerCase()===username.toLowerCase());}catch(e){}
    const activeIds=new Set(items.map(a=>String(a.id)));
    const chunks=(arr,size)=>{const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out;};
    // Primeiro grava a lista atual. Assim, uma falha posterior não apaga o catálogo válido.
    for(const group of chunks(items,400)){
      const batch=writeBatch(db);
      group.forEach(a=>batch.set(doc(db,"users",uid,"animeCatalog",String(a.id)),{
        ...a,anilistUser:username,inList:true,syncedAt:serverTimestamp()
      },{merge:true}));
      await batch.commit();
    }
    // Itens removidos da lista do AniList deixam de aparecer, mas seus metadados não são apagados.
    for(const group of chunks(existing.filter(d=>!activeIds.has(d.id)),400)){
      const batch=writeBatch(db);group.forEach(d=>batch.set(d.ref,{inList:false,syncedAt:serverTimestamp()},{merge:true}));await batch.commit();
    }
    await setDoc(doc(db,"users",uid,"animeCatalog","_meta"),{anilistUser:username,lastSyncedAt:serverTimestamp(),itemCount:items.length,syncIntervalHours:24},{merge:true});
    return items.length;
  },
  saveThemeCatalog:async(animeId,themes)=>{
    if(!auth.currentUser)throw new Error("Faça login para salvar a lista de músicas.");
    const catalog=themes.map(t=>({slug:t.slug,type:t.type,title:t.title,artist:t.artist,eps:t.eps||"",video:t.video||""}));
    await setDoc(doc(db,"users",auth.currentUser.uid,"animeNotes",String(animeId)),{animeId:Number(animeId),themeCatalog:catalog,themeCatalogUpdatedAt:serverTimestamp()},{merge:true});
    // Mantém o IndexedDB sincronizado com o Firestore sem sobrescrever comentários,
    // notas pessoais ou outros campos já presentes no cache.
    const key=noteCacheKey(animeId),old=(await cacheGet(key))?.data||{};
    await cacheSet(key,{...old,animeId:Number(animeId),themeCatalog:catalog});
  },
  // Leitura pública das informações exibidas nas abas Estatísticas e Ranking.
  // A identidade do proprietário é fixa; as regras do Firestore permitem leitura,
  // enquanto todas as operações de escrita continuam exigindo autenticação do dono.
  getAllAnimeNotes:async({refresh=false}={})=>{
    if(refresh)await cacheDelete("stats:animeNotes");
    return freshOrCached("stats:animeNotes",async()=>{const snap=await getDocs(collection(db,"users",OWNER_UID,"animeNotes"));const out={};snap.forEach(d=>out[d.id]=d.data());return out;});
  },
  getAllEpisodeLogs:async({refresh=false}={})=>{

    return freshOrCached("stats:episodeLogs",async()=>{const snap=await getDocs(collection(db,"users",OWNER_UID,"episodeLogs"));return snap.docs.map(d=>({id:d.id,...d.data()}));});
  },
  exportData:async()=>{
    if(!auth.currentUser)throw new Error("Faça login para exportar seus dados.");
    const uid=auth.currentUser.uid;
    const [catalog,notes,logs,scores]=await Promise.all([
      getDocs(collection(db,"users",uid,"animeCatalog")),
      getDocs(collection(db,"users",uid,"animeNotes")),
      getDocs(collection(db,"users",uid,"episodeLogs")),
      getDocs(collection(db,"songScores"))
    ]);
    const clean=value=>{
      if(value&&typeof value.toDate==="function")return value.toDate().toISOString();
      if(Array.isArray(value))return value.map(clean);
      if(value&&typeof value==="object") {const out={};for(const [k,v] of Object.entries(value))out[k]=clean(v);return out;}
      return value;
    };
    const docs=snap=>snap.docs.map(d=>({id:d.id,...clean(d.data())}));
    return {format:"hub-animes-backup",version:1,exportedAt:new Date().toISOString(),user:{uid,displayName:auth.currentUser.displayName||null},data:{animeCatalog:docs(catalog),animeNotes:docs(notes),episodeLogs:docs(logs),songScores:docs(scores)}};
  },
  validateBackup:backup=>{
    if(!backup||typeof backup!=="object"||backup.format!=="hub-animes-backup"||backup.version!==1)throw new Error("Formato ou versão de backup não reconhecidos.");
    if(!backup.data||typeof backup.data!=="object")throw new Error("O arquivo não contém a seção de dados.");
    const names=["animeCatalog","animeNotes","episodeLogs","songScores"],counts={};
    for(const name of names){
      const rows=backup.data[name];
      if(!Array.isArray(rows))throw new Error(`A seção ${name} está ausente ou inválida.`);
      const seen=new Set();
      for(const row of rows){
        if(!row||typeof row!=="object"||Array.isArray(row)||typeof row.id!=="string"||!row.id.trim()||row.id.includes("/"))throw new Error(`Há um registro inválido na seção ${name}.`);
        if(seen.has(row.id))throw new Error(`O backup contém IDs duplicados em ${name}.`);
        seen.add(row.id);
      }
      counts[name]=rows.length;
    }
    return {counts,total:Object.values(counts).reduce((a,b)=>a+b,0)};
  },
  previewImport:async backup=>{
    requireOwner();
    const validation=window.hubFB.validateBackup(backup),uid=auth.currentUser.uid;
    const destinations={
      animeCatalog:row=>doc(db,"users",uid,"animeCatalog",row.id),
      animeNotes:row=>doc(db,"users",uid,"animeNotes",row.id),
      episodeLogs:row=>doc(db,"users",uid,"episodeLogs",row.id),
      songScores:row=>doc(db,"songScores",row.id)
    };
    const normalize=value=>{
      if(value&&typeof value.toDate==="function")return value.toDate().toISOString();
      if(value instanceof Date)return value.toISOString();
      if(Array.isArray(value))return value.map(normalize);
      if(value&&typeof value==="object"){
        const out={};for(const key of Object.keys(value).sort())out[key]=normalize(value[key]);return out;
      }
      return value;
    };
    const same=(a,b)=>JSON.stringify(normalize(a))===JSON.stringify(normalize(b));
    const items=[];
    const tasks=[];
    for(const section of Object.keys(destinations))for(const row of backup.data[section])tasks.push({section,row,ref:destinations[section](row)});
    // Leituras pontuais ao servidor, com concorrência limitada para não disparar centenas de requisições simultâneas.
    for(let i=0;i<tasks.length;i+=12){
      const group=tasks.slice(i,i+12);
      const results=await Promise.all(group.map(async task=>{
        const snap=await getDocFromServer(task.ref);
        const {id,...incoming}=task.row;
        if(!snap.exists())return {...task,action:"add",label:task.row.title?.userPreferred||(typeof task.row.title==="string"?task.row.title:null)||task.row.name||task.row.animeTitle||(task.row.animeId?`Anime ${task.row.animeId}`:id)};
        const existing=snap.data();
        const keys=new Set([...Object.keys(existing),...Object.keys(incoming)]);
        const differences=[...keys].filter(key=>!same(existing[key],incoming[key]));
        return {...task,action:differences.length?"attention":"ignore",differences,label:task.row.title?.userPreferred||(typeof task.row.title==="string"?task.row.title:null)||task.row.name||task.row.animeTitle||(task.row.animeId?`Anime ${task.row.animeId}`:id)};
      }));
      items.push(...results);
    }
    const summary={add:items.filter(x=>x.action==="add").length,ignore:items.filter(x=>x.action==="ignore").length,attention:items.filter(x=>x.action==="attention").length};
    const bySection={};
    for(const section of Object.keys(destinations))bySection[section]={add:items.filter(x=>x.section===section&&x.action==="add").length,ignore:items.filter(x=>x.section===section&&x.action==="ignore").length,attention:items.filter(x=>x.section===section&&x.action==="attention").length};
    return {counts:validation.counts,total:validation.total,summary,bySection,items:items.map(item=>({section:item.section,id:item.row.id,action:item.action,differences:item.differences||[],label:item.label})),createdAt:Date.now()};
  },
  importData:async(backup,preview)=>{
    requireOwner();
    const validation=window.hubFB.validateBackup(backup),uid=auth.currentUser.uid;
    const plan=preview||await window.hubFB.previewImport(backup);
    const dateFields=new Set(["createdAt","updatedAt","syncedAt","lastSyncedAt","themeCatalogUpdatedAt","confirmedAt"]);
    const restoreDates=(value,key="",path=[])=>{
      if(value===null||value===undefined)return value;
      if(typeof value==="string"&&(dateFields.has(key)||(key==="changedAt"&&path.includes("definitiveRatingHistory")))){
        const time=Date.parse(value);if(Number.isFinite(time))return new Date(time);
      }
      if(Array.isArray(value))return value.map(v=>restoreDates(v,"",path));
      if(typeof value==="object"){const out={};for(const [k,v] of Object.entries(value))out[k]=restoreDates(v,k,[...path,k]);return out;}
      return value;
    };
    const destinations={
      animeCatalog:row=>doc(db,"users",uid,"animeCatalog",row.id),
      animeNotes:row=>doc(db,"users",uid,"animeNotes",row.id),
      episodeLogs:row=>doc(db,"users",uid,"episodeLogs",row.id),
      songScores:row=>doc(db,"songScores",row.id)
    };
    const rowsBySection=Object.fromEntries(Object.keys(destinations).map(name=>[name,new Map(backup.data[name].map(row=>[row.id,row]))]));
    const candidates=(plan.items||[]).filter(item=>item.action==="add");
    const counts=Object.fromEntries(Object.keys(destinations).map(name=>[name,{added:0,skipped:0,failed:0}]));
    const failures=[];
    // Cada criação é transacional: se outro processo criar o documento após a prévia, ele não será sobrescrito.
    for(let i=0;i<candidates.length;i+=5){
      const group=candidates.slice(i,i+5);
      const outcomes=await Promise.all(group.map(async item=>{
        const row=rowsBySection[item.section]?.get(item.id);
        if(!row)return {section:item.section,status:"failed",error:"Registro não encontrado no arquivo após a prévia."};
        try{
          const ref=destinations[item.section](row);
          const {id,...fields}=row;
          const data=restoreDates(fields);
          const status=await runTransaction(db,async transaction=>{
            const snap=await transaction.get(ref);
            if(snap.exists())return "skipped";
            transaction.set(ref,data);
            return "added";
          });
          return {section:item.section,status};
        }catch(error){return {section:item.section,status:"failed",error:error?.code||error?.message||"Erro desconhecido",id:item.id}}
      }));
      for(const outcome of outcomes){
        counts[outcome.section][outcome.status]++;
        if(outcome.status==="failed")failures.push(outcome);
      }
    }
    for(const section of Object.keys(counts)){
      counts[section].ignored=plan.bySection?.[section]?.ignore||0;
      counts[section].attention=plan.bySection?.[section]?.attention||0;
    }
    const added=Object.values(counts).reduce((sum,c)=>sum+c.added,0);
    const skipped=Object.values(counts).reduce((sum,c)=>sum+c.skipped+c.ignored+c.attention,0);
    const failed=Object.values(counts).reduce((sum,c)=>sum+c.failed,0);
    if(added){
      await cacheDelete("songScores");await cacheDelete("stats:animeNotes");await cacheDelete("stats:episodeLogs");
      for(const item of candidates){
        if(item.section==="animeNotes")await cacheDelete(noteCacheKey(item.id));
        if(item.section==="episodeLogs"){
          const row=rowsBySection.episodeLogs.get(item.id);if(row?.animeId!==undefined)await cacheDelete(logsCacheKey(row.animeId));
        }
        if(item.section==="songScores"){
          const animeId=String(item.id).split(":")[0];await cacheDelete(`songScoresAnime:${animeId}`);
        }
      }
      if(counts.animeCatalog.added)await cacheDelete(`anilist:${OWNER_ANILIST_USERNAME.toLowerCase()}`);
    }
    if(failures.length)console.error("Falhas na importação do backup:",failures);
    return {counts,added,skipped,failed,failures,total:validation.total};
  },
  getAnimeNote:async (animeId,{refresh=false}={})=>{
    const key=noteCacheKey(animeId);
    if(refresh){
      const snap=await getDocFromServer(notePath(animeId));
      const fresh=snap.exists()?snap.data():{};
      await cacheSet(key,fresh);
      return fresh;
    }
    return freshOrCached(key,async()=>{const snap=await getDoc(notePath(animeId));return snap.exists()?snap.data():{}});
  },
  saveAnimeNote:async(animeId,data)=>{
    requireOwner();
    const old=(await cacheGet(noteCacheKey(animeId)))?.data||{};
    const payload={animeId:Number(animeId),...data,updatedAt:serverTimestamp()};
    let updatedCache={...old,...data};
    if(Object.prototype.hasOwnProperty.call(data,"provisionalScore")){
      const nextScore=data.provisionalScore===null||data.provisionalScore===""?null:Number(data.provisionalScore);
      const previousScore=old.provisionalScore===null||old.provisionalScore===undefined?null:Number(old.provisionalScore);
      payload.provisionalScore=nextScore;
      // Remove a possible legacy category field when migrating to the numeric model.
      payload.provisionalTier=deleteField();
      delete updatedCache.provisionalTier;
      if(nextScore!==previousScore){
        const historyEntry={score:nextScore,changedAt:new Date().toISOString()};
        payload.provisionalRatingHistory=arrayUnion(historyEntry);
        updatedCache.provisionalRatingHistory=[...(Array.isArray(old.provisionalRatingHistory)?old.provisionalRatingHistory:[]),historyEntry];
      }
      updatedCache.provisionalScore=nextScore;
    }
    await setDoc(notePath(animeId),payload,{merge:true});
    await cacheSet(noteCacheKey(animeId),updatedCache);
    await cacheDelete("stats:animeNotes");
  },
  saveDefinitiveRating:async(animeId,score)=>{
    requireOwner();
    const numericScore=Number(score);
    if(!Number.isInteger(numericScore)||numericScore<0||numericScore>100)throw new Error("Informe uma nota definitiva inteira entre 0 e 100.");
    const ref=notePath(animeId);
    // A transação lê a versão atual no servidor: evita depender de cache antigo
    // e impede que duas revisões simultâneas sobrescrevam o histórico uma da outra.
    const result=await runTransaction(db,async transaction=>{
      const snap=await transaction.get(ref);
      const old=snap.exists()?snap.data():{};
      const rawPrevious=old.definitiveRating?.score;
      const previousScore=rawPrevious===null||rawPrevious===undefined?null:Number(rawPrevious);
      if(previousScore!==null&&Number.isFinite(previousScore)&&previousScore===numericScore){
        return {changed:false,score:numericScore,data:old};
      }
      const rawProvisional=old.provisionalScore;
      const provisionalSnapshot=rawProvisional===null||rawProvisional===undefined||rawProvisional===""?null:Number(rawProvisional);
      const changedAt=Timestamp.now();
      const historyEntry={
        previousScore:Number.isFinite(previousScore)?previousScore:null,
        score:numericScore,
        provisionalScoreAtConfirmation:Number.isFinite(provisionalSnapshot)?provisionalSnapshot:null,
        changedAt
      };
      const oldHistory=Array.isArray(old.definitiveRatingHistory)?old.definitiveRatingHistory:[];
      const definitiveRating={
        score:numericScore,
        provisionalScoreAtConfirmation:historyEntry.provisionalScoreAtConfirmation,
        confirmedAt:changedAt
      };
      const nextData={
        ...old,
        animeId:Number(animeId),
        definitiveRating,
        definitiveRatingHistory:[...oldHistory,historyEntry],
        updatedAt:changedAt
      };
      transaction.set(ref,{
        animeId:Number(animeId),
        definitiveRating,
        definitiveRatingHistory:nextData.definitiveRatingHistory,
        updatedAt:serverTimestamp()
      },{merge:true});
      return {
        changed:true,score:numericScore,previousScore:historyEntry.previousScore,
        provisionalScoreAtConfirmation:historyEntry.provisionalScoreAtConfirmation,
        confirmedAt:changedAt.toDate().toISOString(),data:nextData
      };
    });
    await cacheSet(noteCacheKey(animeId),result.data);
    if(result.changed)await cacheDelete("stats:animeNotes");
    return result;
  },
  saveThemeComment:async(animeId,slug,comment)=>{requireOwner();await setDoc(notePath(animeId),{animeId:Number(animeId),themeComments:{[slug]:comment},updatedAt:serverTimestamp()},{merge:true});const old=(await cacheGet(noteCacheKey(animeId)))?.data||{};await cacheSet(noteCacheKey(animeId),{...old,themeComments:{...(old.themeComments||{}),[slug]:comment}});await cacheDelete("stats:animeNotes");},
  associateProvisionalTheme:async(animeId,kind,targetSlug)=>{
    requireOwner();if(!["OP","ED"].includes(kind))throw new Error("Tipo de música inválido.");
    const sourceSlug=PROVISIONAL_THEME_SLUGS[kind],sourceKey=`${animeId}:${sourceSlug}`,targetKey=`${animeId}:${targetSlug}`;
    if(sourceKey===targetKey)throw new Error("Escolha uma música diferente.");
    const sourceRef=doc(db,"songScores",sourceKey),targetRef=doc(db,"songScores",targetKey),noteRef=notePath(animeId);
    const [sourceSnap,targetSnap,noteSnap]=await Promise.all([getDoc(sourceRef),getDoc(targetRef),getDoc(noteRef)]);
    const note=noteSnap.exists()?noteSnap.data():{},comments=note.themeComments||{},sourceComment=comments[sourceSlug]||"",targetComment=comments[targetSlug]||"";
    if((sourceSnap.exists()&&targetSnap.exists())||(sourceComment&&targetComment))throw new Error("Essa música já possui uma nota ou comentário do mesmo tipo. Para evitar sobrescrever seus dados, escolha outra música ou mantenha a avaliação provisória.");
    if(!sourceSnap.exists()&&!sourceComment)throw new Error("Não há nota ou comentário provisório para transferir.");
    const batch=writeBatch(db);
    if(sourceSnap.exists()){batch.set(targetRef,{...sourceSnap.data(),updatedAt:serverTimestamp()},{merge:true});batch.delete(sourceRef);}
    // Remove explicitamente a chave provisória do mapa aninhado no Firestore.
    // merge:true não remove campos omitidos de mapas; por isso usamos deleteField().
    if(noteSnap.exists()){
      const commentUpdate={[`themeComments.${sourceSlug}`]:deleteField(),updatedAt:serverTimestamp()};
      if(sourceComment)commentUpdate[`themeComments.${targetSlug}`]=sourceComment;
      batch.update(noteRef,commentUpdate);
    }
    await batch.commit();
    const old=(await cacheGet(noteCacheKey(animeId)))?.data||note,updatedComments={...(old.themeComments||{})};
    delete updatedComments[sourceSlug];if(sourceComment)updatedComments[targetSlug]=sourceComment;
    await cacheSet(noteCacheKey(animeId),{...old,themeComments:updatedComments});await cacheDelete("stats:animeNotes");
    const allScores=(await cacheGet("songScores"))?.data||{};
    if(sourceSnap.exists()){allScores[targetKey]=sourceSnap.data().score;delete allScores[sourceKey];await cacheSet("songScores",allScores);}
    const animeScores=(await cacheGet(`songScoresAnime:${animeId}`))?.data||{};
    if(sourceSnap.exists()){animeScores[targetKey]=sourceSnap.data().score;delete animeScores[sourceKey];await cacheSet(`songScoresAnime:${animeId}`,animeScores);}
    return true;
  },
  addLog:async({animeId,episode,watchedAt,comment})=>{requireOwner();await addDoc(logsPath(),{animeId:Number(animeId),episode:Number(episode),watchedAt,comment,createdAt:serverTimestamp()});await cacheDelete(logsCacheKey(animeId));await cacheDelete("stats:episodeLogs")},
  getLogs:async (animeId,{refresh=false}={})=>{
    const key=logsCacheKey(animeId),q=query(logsPath(),where("animeId","==",Number(animeId)));
    if(refresh){const snap=await getDocsFromServer(q),logs=snap.docs.map(d=>({id:d.id,...d.data(),createdAtMs:d.data().createdAt?.toMillis?.()||0}));await cacheSet(key,logs);return logs;}
    return freshOrCached(key,async()=>{const snap=await getDocs(q);return snap.docs.map(d=>({id:d.id,...d.data(),createdAtMs:d.data().createdAt?.toMillis?.()||0}))});
  },
  updateLog:async(id,changes)=>{requireOwner();await updateDoc(doc(db,"users",OWNER_UID,"episodeLogs",id),{...changes,updatedAt:serverTimestamp()});await cacheDelete(logsCacheKey(window.activeDiaryAnime));await cacheDelete("stats:episodeLogs")},
  deleteLog:async id=>{requireOwner();await deleteDoc(doc(db,"users",OWNER_UID,"episodeLogs",id));await cacheDelete(logsCacheKey(window.activeDiaryAnime));await cacheDelete("stats:episodeLogs")} 
};
onAuthStateChanged(auth,u=>{
  emit("fb-user",u&&u.uid===OWNER_UID?{uid:u.uid,name:u.displayName||u.email}:null);
  if(u&&u.uid!==OWNER_UID)signOut(auth).catch(()=>{});
  if(window.activeDiaryAnime&&document.getElementById("detail-diary")&&!document.getElementById("detail-diary").classList.contains("hidden"))window.dispatchEvent(new CustomEvent("diary-auth-refresh"));
});
